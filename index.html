<style>
/* Layout: phone-first club app. Black stage, logo ring motif (thin lilac arcs) on progress, gold type, lilac for action. */
:root{
  --ink:#0A090C; --stage:#121015; --stage-2:#1A171E; --stage-3:#232028; --line:#2E2934;
  --gold:#E6D38A; --gold-soft:#CDBE86; --cream:#EFE6C9; --muted:#9C927A;
  --lilac:#DCC8F5; --lilac-deep:#A88AD8; --lilac-ink:#1A1225;
  --good:#9ED6B3; --warn:#F0C46A; --bad:#EE9A9A;
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:"Montserrat","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-script:"Allura","Snell Roundhand","Brush Script MT",cursive;
  --r-s:10px; --r-m:16px; --r-l:24px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--cream)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);color:var(--gold);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0}
.eyebrow{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--lilac);font-weight:600}
.label{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.script{font-family:var(--f-script);color:var(--lilac);font-weight:400}
.muted{color:var(--muted)} .small{font-size:.82rem} .tiny{font-size:.72rem}
.gold{color:var(--gold)} .lil{color:var(--lilac)}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.shell.wide{max-width:1180px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--ink) 75%,transparent);display:flex;align-items:center;gap:12px;padding-block:14px 12px}
.topbar img{width:40px;height:40px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-weight:500;letter-spacing:.32em;font-size:.72rem;color:var(--gold)}
.brand span{font-family:var(--f-script);color:var(--lilac);font-size:1.05rem;margin-top:2px}
.topbar .sp{flex:1}
.iconbtn{background:var(--stage-2);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--gold)}
.iconbtn svg{width:19px;height:19px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(10,9,12,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:.66rem;letter-spacing:.06em;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--gold)}
.nav button.on svg{color:var(--lilac)}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--stage);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent}
.card.lilac{background:var(--lilac);color:var(--lilac-ink);border-color:var(--lilac)}
.card.lilac h2,.card.lilac h3{color:var(--lilac-ink)}
.card.lilac .label{color:#5B4A72}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.divider{height:1px;background:var(--line);border:0;margin:0}
.pageh{display:flex;flex-direction:column;gap:4px;margin:6px 0 4px}

/* buttons */
.btn{appearance:none;border:1px solid var(--lilac);background:var(--lilac);color:var(--lilac-ink);font-weight:600;border-radius:999px;padding:11px 18px;cursor:pointer;font-size:.88rem;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:transparent;color:var(--gold);border-color:var(--gold-soft)}
.btn.quiet{background:var(--stage-2);color:var(--cream);border-color:var(--line)}
.btn.small{padding:7px 12px;font-size:.78rem}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--bad);border-color:#5a3434}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--lilac);cursor:pointer;padding:0;font-size:.82rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--stage-2);color:var(--cream);border-radius:999px;padding:7px 13px;font-size:.8rem;cursor:pointer}
.chip.on{background:var(--lilac);color:var(--lilac-ink);border-color:var(--lilac);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:600;letter-spacing:.04em;border:1px solid var(--line);color:var(--cream)}
.pill.good{color:var(--good);border-color:#2f5140}
.pill.warn{color:var(--warn);border-color:#5b4924}
.pill.bad{color:var(--bad);border-color:#5a3434}
.pill.lil{color:var(--lilac);border-color:#4a3d5e}
.pill.gold{color:var(--gold);border-color:#5a5130}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.inp,select.inp,textarea.inp{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;color:var(--cream);font-size:.95rem;min-width:0}
textarea.inp{min-height:90px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--lilac-deep);outline:none}
.inp.num{text-align:right}
.unit{display:flex;align-items:center;gap:6px}
.unit span{color:var(--muted);font-size:.8rem}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{accent-color:var(--lilac);width:20px;height:20px}

/* rings + bars */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ring svg{width:100%;max-width:78px;height:auto}
.ring .v{font-size:.82rem;font-weight:600;color:var(--gold)}
.ring .k{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--stage-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lilac);border-radius:99px}
.bar.gold i{background:var(--gold)}
.bar.over i{background:var(--warn)}
.macro{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;font-size:.85rem}

/* list rows */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{color:var(--cream);font-weight:500}
.li .s{color:var(--muted);font-size:.8rem}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--stage-3);flex:none}
.tile{background:var(--stage-2);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;color:var(--cream);min-width:0}
.tile:hover{border-color:var(--lilac-deep)}
.tile svg{width:22px;height:22px;color:var(--lilac)}
.tile b{font-weight:600;color:var(--gold);font-size:.92rem}
.tile span{font-size:.75rem;color:var(--muted)}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-m);padding:12px 14px;border:1px solid #4a3d5e;background:#1b1622}
.banner.warn{border-color:#5b4924;background:#1e190f}
.banner svg{flex:none;width:20px;height:20px;color:var(--lilac);margin-top:2px}
.banner.warn svg{color:var(--warn)}
.banner .grow{flex:1;min-width:0}

/* quote */
.quote{position:relative;padding:22px 20px 20px;border-radius:var(--r-l);background:radial-gradient(120% 140% at 100% 0%,#2a2136 0%,var(--stage) 55%);border:1px solid var(--line);overflow:hidden}
.quote::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:2px solid var(--lilac);border-left-color:transparent;border-bottom-color:transparent;opacity:.55}
.quote p{font-family:var(--f-display);font-size:1.5rem;line-height:1.25;color:var(--gold);font-style:italic;max-width:30ch;position:relative}
.quote .by{font-family:var(--f-script);color:var(--lilac);font-size:1.35rem;margin-top:10px;display:block}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:40px 60px;text-align:center}
.login img.logo{width:min(46vw,190px);height:auto}
.login .wordmark{font-size:.9rem;letter-spacing:.42em;color:var(--gold);font-weight:500;margin-right:-.42em}
.login .club{font-family:var(--f-display);font-size:2.6rem;color:var(--gold);line-height:1}
.login .club em{font-style:italic;color:var(--lilac)}
.login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:left}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.who button{background:var(--stage);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 10px;color:var(--gold);font-family:var(--f-display);font-size:1.25rem;cursor:pointer}
.who button.on{border-color:var(--lilac);background:#1c1625;box-shadow:inset 0 0 0 1px var(--lilac)}
.who button.coach{grid-column:1/-1;font-family:var(--f-ui);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:10px}
.who button.coach.on{color:var(--lilac)}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}

/* cycle */
.phase{border-radius:var(--r-l);padding:18px;display:flex;gap:16px;align-items:center;background:var(--stage);border:1px solid var(--line)}
.phase .dial{flex:none;width:96px;height:96px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0}
.cal button{aspect-ratio:1;max-width:100%;border-radius:12px;border:1px solid transparent;background:var(--stage-2);color:var(--cream);font-size:.82rem;cursor:pointer;position:relative;display:grid;place-items:center;padding:0}
.cal button.out{opacity:.25}
.cal button.per{background:#5b2f45;color:#ffe3ef}
.cal button.pred{background:transparent;border:1px dashed #a46a88;color:#f1c7da}
.cal button.fert{background:#262036}
.cal button.ovu{background:#3a2d52;border-color:var(--lilac)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cal button.sel{outline:2px solid var(--lilac);outline-offset:1px}
.cal button i{position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.72rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--stage-2);border-radius:10px;padding:8px 0;cursor:pointer;color:var(--cream);font-size:.78rem}
.scale button.on{background:var(--lilac);color:var(--lilac-ink);border-color:var(--lilac);font-weight:600}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--stage);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-l) var(--r-l) 0 0;width:100%;max-width:620px;max-height:92%;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:45;display:grid;place-items:center;padding:20px}
.modal .box{max-width:420px;width:100%;background:var(--stage);border:1px solid var(--lilac-deep);border-radius:var(--r-l);padding:24px;display:flex;flex-direction:column;gap:14px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--ink);font-weight:600;padding:10px 18px;border-radius:999px;z-index:50;font-size:.85rem;max-width:90%}

/* training */
.ex{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--stage-2)}
.ex .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex .name{font-weight:600;color:var(--gold)}
.ex .meta{font-size:.82rem;color:var(--lilac)}
.ex details summary{cursor:pointer;color:var(--muted);font-size:.8rem}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center}
.setrow .n{color:var(--muted);font-size:.8rem;text-align:center}
.setrow .ok{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--ink);cursor:pointer;color:var(--muted);display:grid;place-items:center}
.tick{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--ink);cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none}
.tick svg{width:18px;height:18px}.tick.on{background:var(--lilac);border-color:var(--lilac);color:var(--lilac-ink)}
.setrow .ok svg{width:18px;height:18px}
.setrow .ok.on{background:var(--lilac);border-color:var(--lilac);color:var(--lilac-ink)}

/* measure */
.mcard{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.mcard svg{width:64px;height:120px}
.photo-slot{aspect-ratio:3/4;max-width:100%;border:1px dashed var(--line);border-radius:var(--r-m);display:grid;place-items:center;overflow:hidden;background:var(--stage-2);cursor:pointer;color:var(--muted);font-size:.75rem;text-align:center;padding:6px;position:relative}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.photo-slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r-m)}

/* leaderboard */
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .pos{font-family:var(--f-display);font-size:1.3rem;color:var(--lilac);text-align:center}
.rank.me .nm{color:var(--gold);font-weight:600}

/* coach */
.ctabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.ctabs button{flex:none;border:1px solid var(--line);background:var(--stage);color:var(--cream);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.8rem}
.ctabs button.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.client{cursor:pointer;text-align:left;color:inherit}
.client:hover{border-color:var(--lilac-deep)}
.client .nm{font-family:var(--f-display);font-size:1.6rem;color:var(--gold);line-height:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.84rem}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
table.t th{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.edrow{display:grid;grid-template-columns:1.6fr .6fr .7fr .7fr auto;gap:6px;align-items:center}
.richtext{white-space:pre-wrap;line-height:1.55;font-size:.9rem}
.richtext h4{font-family:var(--f-display);color:var(--gold);font-size:1.15rem;margin:10px 0 2px;font-weight:600}
.study{border-left:2px solid var(--lilac-deep);padding-left:12px;display:flex;flex-direction:column;gap:4px}
.study a{color:var(--lilac);font-size:.78rem}
.empty{border:1px dashed var(--line);border-radius:var(--r-m);padding:18px;text-align:center;color:var(--muted);font-size:.85rem}
@media (max-width:420px){ .rings{grid-template-columns:repeat(2,1fr)} h1{font-size:1.75rem} .edrow{grid-template-columns:1fr 1fr} .edrow .wide{grid-column:1/-1} }
@media (prefers-reduced-motion:no-preference){ .fade{animation:fade .35s ease both} @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>

<script>

// ---------- Speichern ----------
const timers = {}, chains = {}, pending = new Set();
let writeBlocked = false;
function persist(key, path, getData, delay = 450) {
  pending.add(key);
  clearTimeout(timers[key]);
  const tid = timers[key] = setTimeout(() => {
    const data = getData();
    chains[key] = (chains[key] || Promise.resolve())
      .then(() => S.db.doc(path).set(data))
      .then(() => { if (timers[key] === tid) pending.delete(key); })
      .catch(e => { pending.delete(key); onWriteErr(e); });
  }, delay);
}
async function writeNow(path, data) {
  try { await S.db.doc(path).set(data); return true; } catch (e) { onWriteErr(e); return false; }
}
async function delNow(path) { try { await S.db.doc(path).delete(); } catch (e) { onWriteErr(e); } }
function onWriteErr(e) {
  console.warn(e);
  if (e && e.code === "invalid_argument" && !writeBlocked) {
    writeBlocked = true;
    modal(`<h3>Speichern nicht möglich</h3><p class="small">Deine Anmeldung ist abgelaufen oder wurde geändert. Bitte melde dich ab und mit deinem Passwort neu an. Klappt es dann noch nicht, gib ${COACH.name} kurz Bescheid.</p><button class="btn block" data-act="closeModal">Verstanden</button>`);
  } else if (e && e.code === "quota_exceeded") toast("Speicher voll. Bitte ältere Fotos löschen.");
  else if (e && e.code !== "invalid_argument") toast("Speichern hat nicht geklappt. Bitte gleich nochmal versuchen.");
}

// ---------- Rendering ----------
let renderQueued = false, dirtyWhileTyping = false;
function render() {
  const a = document.activeElement;
  if (a && root.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== "checkbox" && a.type !== "file") { dirtyWhileTyping = true; return; }
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; doRender(); });
}
root.addEventListener("focusout", () => { if (dirtyWhileTyping) { dirtyWhileTyping = false; setTimeout(render, 30); } });

function doRender() {
  if (!S.sess) { root.innerHTML = viewLogin(); return; }
  if (S.sess.role === "coach") { root.innerHTML = viewCoach(); return; }
  const v = (VIEWS[S.route] || VIEWS.home)();
  root.innerHTML = topbar() + `<main class="shell"><div class="stack fade">${v}</div></main>` + navbar();
}
function topbar() {
  const sub = !["home", "training", "food", "cycle", "more"].includes(S.route);
  return `<header class="shell" style="padding-bottom:0"><div class="topbar">
    ${sub ? `<button class="iconbtn" data-act="back" aria-label="Zurück">${I.back}</button>` : `<img src="${LOGO}" alt="Her Movement Logo">`}
    <div class="brand"><b>HER MOVEMENT CLUB</b><span>by Lisa-Marie</span></div><div class="sp"></div>
    <button class="iconbtn" data-act="go" data-r="appointments" aria-label="Termine">${I.cal}</button>
  </div></header>`;
}
function navbar() {
  const grp = { home: "home", training: "training", food: "food", cycle: "cycle" }[S.route] || "more";
  const b = (r, ic, t) => `<button class="${grp === r ? "on" : ""}" data-act="tab" data-r="${r}">${ic}<span>${t}</span></button>`;
  return `<nav class="nav"><div class="nav-in">${b("home", I.home, "Heute")}${b("training", I.dumb, "Training")}${b("food", I.food, "Ernährung")}${b("cycle", I.moon, "Zyklus")}${b("more", I.more, "Mehr")}</div></nav>`;
}
function go(r) { S.stack.push(S.route); S.route = r; window.scrollTo(0, 0); render(); }
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }
function modal(html) { layer.innerHTML = `<div class="modal" data-act="veil"><div class="box" role="dialog" aria-modal="true">${html}</div></div>`; }
let sheetFn = null;
function sheet(fn) { sheetFn = fn; drawSheet(); }
function drawSheet() {
  const old = layer.querySelector(".sheet"); const st = old ? old.scrollTop : 0;
  layer.innerHTML = `<div class="veil" data-act="veil"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${sheetFn()}</div></div>`;
  const nw = layer.querySelector(".sheet"); if (nw) nw.scrollTop = st;
}
function closeLayer() { layer.innerHTML = ""; sheetFn = null; }

// ---------- Plattform ----------
async function boot() {
  render();
  const C = window.claude;
  if (!C || !C.use) { S.platform = "none"; render(); return; }
  const [db, user, sample] = await Promise.all([C.use("db"), C.use("user"), C.use("sample")]);
  S.db = db; S.user = user; S.sample = sample;
  if (!db || !user) { S.platform = "none"; render(); return; }
  S.uid = await user.id(); S.owner = await user.isOwner();
  if (!S.uid) { S.platform = "none"; render(); return; }
  if (sample) { S.imgOK = true; try { S.sampleLimits = await sample.limits(); } catch (e) {} }
  S.platform = "ok";
  const t = setTimeout(() => { if (!S.configLoaded) { S.platform = "slow"; render(); } }, 10000);
  db.doc("club/config").onSnapshot(s => {
    clearTimeout(t); S.configLoaded = true; S.config = s.exists ? s.data() : null; if (S.platform === "slow") S.platform = "ok";
    if (!S.sess) tryRestore(); render();
  }, e => { clearTimeout(t); S.platform = "none"; render(); });
}
function tryRestore() {
  const s = window.HM.session();
  if (!s || !S.config) return;
  S.uid = s.uid; S.owner = s.role === "coach";

VIEWS.cycle = () => {
  const c = S.cycle ? cyc() : null; const st = c ? stats() : null;

   <div class="banner">${I.lock}<div class="grow small">Alles hier ist nur für dich sichtbar. ${COACH.name} sieht deinen Zyklus nur, wenn du ihn selbst teilst.</div></div>
   <section class="card"><h3>Lass uns starten</h3><p class="small">Mit drei Angaben kann der Club deine Phasen berechnen und dein Training anpassen.</p>
   <div class="field"><label for="cs1">Erster Tag deiner letzten Periode</label><input class="inp" type="date" id="cs1" value="${addD(today(), -10)}" max="${today()}"></div>
   <div class="grid2"><div class="field"><label for="cs2">Dauer der Periode (Tage)</label><input class="inp num" id="cs2" inputmode="numeric" value="5"></div><div class="field"><label for="cs3">Zykluslänge (Tage)</label><input class="inp num" id="cs3" inputmode="numeric" value="28"></div></div>
   <div class="field"><label for="cs4">Verhütung</label><select class="inp" id="cs4"><option value="none">Keine / natürlich</option><option value="copper">Kupferspirale oder -kette</option><option value="hormonal">Hormonell (Pille, Hormonspirale, Ring …)</option></select></div>
   <button class="btn block" data-act="cycleSetup">Zyklus einrichten</button><p class="tiny muted">Unsicher? Schätz einfach. Der Club lernt mit jeder eingetragenen Periode dazu.</p></section>`;
  const ph = phaseOn(today()), P = PHASES[ph?.phase || "foll"];
  const m = S.calMonth || monthKey(); const sel = S.calSel || today(); const e = c.days[sel] || {};
  const [y, mo] = m.split("-").map(Number); const first = new Date(y, mo - 1, 1); const offset = (first.getDay() + 6) % 7; const dim = new Date(y, mo, 0).getDate();
  let cells = ""; for (let i = 0; i < offset; i++) cells += `<span></span>`;
  for (let dd = 1; dd <= dim; dd++) {
    const s = m + "-" + pad(dd); const p = phaseOn(s); const cls = [];
    if (inPeriod(s) || num(c.days[s]?.flow) >= 2) cls.push("per"); else if (p && s > today() && p.phase === "mens" && !p.late) cls.push("pred"); else if (p && p.ovu && !p.late) cls.push("ovu"); else if (p && p.fertile && !p.late) cls.push("fert");
    if (s === today()) cls.push("today"); if (s === sel) cls.push("sel");
    cells += `<button class="${cls.join(" ")}" data-act="calSel" data-d="${s}" aria-label="${fmtLong(s)}">${dd}${c.days[s] ? "<i></i>" : ""}</button>`;
  }
  const R = 40, C = 2 * Math.PI * R, frac = ph ? Math.min(1, ph.cd / ph.len) : 0;
  const hormonal = c.settings.contra === "hormonal";
  const disc = DISCHARGE.find(x => x.k === e.discharge);
  return `
  <div class="pageh"><div class="eyebrow">Zyklus · privat</div><h1>Dein Zyklus</h1></div>
  <div class="phase"><svg class="dial" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="${R}" fill="none" stroke="var(--stage-3)" stroke-width="6"/><circle cx="48" cy="48" r="${R}" fill="none" stroke="${P.color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C * frac} ${C}" transform="rotate(-90 48 48)"/><text x="48" y="46" text-anchor="middle" fill="var(--gold)" font-family="Cormorant Garamond" font-size="28" font-weight="600">${ph ? ph.cd : "–"}</text><text x="48" y="62" text-anchor="middle" fill="var(--muted)" font-family="Montserrat" font-size="8" letter-spacing="1.5">ZYKLUSTAG</text></svg>
    <div class="stack" style="gap:4px;min-width:0"><div class="eyebrow">${ph?.late ? "Periode überfällig" : "Aktuelle Phase"}</div><h2>${ph?.late ? "Tag " + ph.cd + " von ca. " + ph.len : P.name}</h2><p class="small">${esc(hormonal ? "Mit hormoneller Verhütung gibt es keinen natürlichen Eisprung. Die Phasen sind hier nur eine Orientierung." : P.hormones)}</p><p class="tiny muted">Nächste Periode ca. ${ph ? fmt(ph.nextStart) : "–"} · Zyklus Ø ${st.len} Tage</p></div></div>
  ${ph?.late && diffD(addD(st.last, st.len), today()) > 7 ? `<div class="banner warn">${I.info}<div class="grow small">Deine Periode ist über eine Woche später als erwartet. Das kann viele Gründe haben, etwa Stress, Krankheit oder zu wenig Energie. Bleibt sie länger aus, sprich mit deiner Frauenärztin.</div></div>` : ""}
  <section class="card"><div class="row between"><button class="iconbtn" data-act="calMove" data-v="-1" aria-label="Vormonat">${I.back}</button><h3>${first.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</h3><button class="iconbtn" data-act="calMove" data-v="1" aria-label="Nächster Monat" style="transform:scaleX(-1)">${I.back}</button></div>
    <div class="cal">${["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map(x => `<span class="dh">${x}</span>`).join("")}${cells}</div>
    <div class="legend"><span><i style="background:#5b2f45"></i>Periode</span><span><i style="border:1px dashed #a46a88"></i>erwartet</span><span><i style="background:#262036"></i>fruchtbar</span><span><i style="background:#3a2d52;border:1px solid var(--lilac)"></i>Eisprung</span></div></section>
  <section class="card"><div class="row between"><div><div class="eyebrow">Eintrag</div><h3>${sel === today() ? "Heute" : esc(fmtLong(sel))}</h3></div>${sel <= today() ? `<span class="small muted">${phaseOn(sel) ? "Zyklustag " + phaseOn(sel).cd : ""}</span>` : ""}</div>
   ${sel > today() ? `<p class="small muted">Für zukünftige Tage kannst du noch nichts eintragen.</p>` : `
    <div class="row"><button class="btn small ${inPeriod(sel) ? "quiet" : ""}" data-act="perStart">Periode beginnt</button><button class="btn small quiet" data-act="perEnd">Periode zu Ende</button></div>
    <div class="field"><label>Blutung</label><div class="scale">${FLOW.map((f, i) => `<button class="${num(e.flow) === i ? "on" : ""}" data-act="cy" data-k="flow" data-v="${i}">${f}</button>`).join("")}</div></div>
    <div class="field"><label>Energie</label><div class="scale">${["sehr niedrig", "niedrig", "okay", "gut", "top"].map((f, i) => `<button class="${num(e.energy) === i + 1 ? "on" : ""}" data-act="cy" data-k="energy" data-v="${i + 1}">${f}</button>`).join("")}</div></div>
    <div class="field"><label>Schmerzen</label><div class="scale" style="grid-template-columns:repeat(4,1fr)">${["keine", "leicht", "mittel", "stark"].map((f, i) => `<button class="${num(e.pain) === i ? "on" : ""}" data-act="cy" data-k="pain" data-v="${i}">${f}</button>`).join("")}</div></div>
    <div class="field"><label>Stimmung</label><div class="chips">${MOODS.map(x => `<button class="chip ${(e.moods || []).includes(x) ? "on" : ""}" data-act="cyT" data-k="moods" data-v="${x}">${x}</button>`).join("")}</div></div>
    <div class="field"><label>Beschwerden</label><div class="chips">${SYMPTOMS.map(x => `<button class="chip ${(e.symptoms || []).includes(x) ? "on" : ""}" data-act="cyT" data-k="symptoms" data-v="${x}">${x}</button>`).join("")}</div></div>
    <div class="field"><label>Ausfluss</label><div class="chips">${DISCHARGE.map(x => `<button class="chip ${e.discharge === x.k ? "on" : ""}" data-act="cy" data-k="discharge" data-v="${x.k}">${x.n}</button>`).join("")}</div>${disc ? `<p class="small ${disc.k === "odd" ? "" : "muted"}" style="${disc.k === "odd" ? "color:var(--warn)" : ""}">${esc(disc.info)}</p>` : ""}</div>
    <div class="field"><label for="cynote">Notiz</label><textarea class="inp" id="cynote" data-cynote="1" style="min-height:60px" placeholder="Nur für dich">${esc(e.note || "")}</textarea></div>`}
  </section>
  <section class="card"><div class="eyebrow">Was jetzt hilft</div><h3>${P.name}</h3>
   <div class="stack" style="gap:10px"><div><div class="label">Körper</div><p class="small">${esc(P.body)}</p></div><div><div class="label">Training</div><p class="small">${esc(P.training)}</p></div><div><div class="label">Ernährung</div><p class="small">${esc(P.food)}</p></div><div><div class="label">Stimmung</div><p class="small">${esc(P.mood)}</p></div></div>
   <button class="linkbtn" data-act="go" data-r="knowledge" style="align-self:flex-start">Studien & Wissen zum Zyklus</button></section>
  ${S.sess?.role === "client" ? `<section class="card"><div class="row between"><div><h3>Mit ${COACH.name} teilen</h3><p class="small muted">Sie sieht dann Phase, Zyklustag, Energie, Schmerzen und Stimmung der letzten 14 Tage. Ausfluss und Notizen bleiben privat.</p></div></div>
   <label class="check"><input type="checkbox" id="shareCycle" data-act="shareCycle" ${S.profile.shareCycle ? "checked" : ""}> ${S.profile.shareCycle ? "Wird geteilt" : "Nicht geteilt"}</label></section>` : ""}
  ${periodsCard()}
  <section class="card"><h3>Einstellungen</h3><div class="grid2"><div class="field"><label for="cyl">Zykluslänge Startwert</label><input class="inp num" id="cyl" data-cyset="len" value="${esc(c.settings.len)}"></div><div class="field"><label for="cyp">Periodendauer Startwert</label><input class="inp num" id="cyp" data-cyset="plen" value="${esc(c.settings.plen)}"></div></div>
   <div class="field"><label for="cyc">Verhütung</label><select class="inp" id="cyc" data-cyset="contra">${[["none", "Keine / natürlich"], ["copper", "Kupferspirale oder -kette"], ["hormonal", "Hormonell"]].map(([k, l]) => `<option value="${k}" ${c.settings.contra === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
   <p class="tiny muted">Eingetragene Perioden: ${st.P.length}. Ab zwei Perioden rechnet der Club mit deinem echten Durchschnitt.</p></section>`;
};

VIEWS.photos = () => {
  if (!S.photos) { loadPhotos(); return `<div class="pageh"><div class="eyebrow">Fortschritt</div><h1>Vorher / Nachher</h1></div><div class="empty">Fotos werden geladen …</div>`; }
  const ph = S.photos; const dates = [...new Set(ph.map(p => p.date))].sort();
  const pd = S.photoDate || today(); const slot = pose => ph.find(p => p.date === pd && p.pose === pose);
  const cp = S.cmp || { pose: "front", a: dates[0], b: dates[dates.length - 1] }; const A = ph.find(p => p.date === cp.a && p.pose === cp.pose), B = ph.find(p => p.date === cp.b && p.pose === cp.pose);
  return `<div class="pageh"><div class="eyebrow">Fortschritt</div><h1>Vorher / Nachher</h1></div>
  <section class="card"><h3>So werden deine Fotos vergleichbar</h3><ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">${PHOTO_GUIDE.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>
  <section class="card"><div class="row between"><h3>Neue Fotos</h3><input class="inp" type="date" id="photoDate" data-act="photoDate" value="${pd}" max="${today()}" style="width:auto"></div>
   <div class="grid3">${[["front", "Vorne"], ["side", "Seite"], ["back", "Hinten"]].map(([k, l]) => { const s = slot(k); return `<label class="photo-slot">${s ? `<img src="${s.img}" alt="${l}">` : `${I.cam}<br>${l}`}<input type="file" accept="image/*" data-photo="${k}" aria-label="Foto ${l}"></label>`; }).join("")}</div>
   <p class="tiny muted">Nur du und ${COACH.name} sehen deine Fotos.</p></section>
  <section class="card"><h3>Vergleichen</h3>${dates.length < 1 ? `<div class="empty">Lade Fotos an zwei Terminen hoch, dann kannst du hier vergleichen.</div>` : `
   <div class="chips">${[["front", "Vorne"], ["side", "Seite"], ["back", "Hinten"]].map(([k, l]) => `<button class="chip ${cp.pose === k ? "on" : ""}" data-act="cmpPose" data-v="${k}">${l}</button>`).join("")}</div>
   <div class="grid2"><select class="inp" id="cmpA" data-cmp="a">${dates.map(d => `<option value="${d}" ${d === cp.a ? "selected" : ""}>${fmt(d, { day: "2-digit", month: "2-digit", year: "numeric" })}</option>`).join("")}</select><select class="inp" id="cmpB" data-cmp="b">${dates.map(d => `<option value="${d}" ${d === cp.b ? "selected" : ""}>${fmt(d, { day: "2-digit", month: "2-digit", year: "numeric" })}</option>`).join("")}</select></div>
   <div class="cmp">${A ? `<img src="${A.img}" alt="Vorher">` : `<div class="photo-slot">kein Foto</div>`}${B ? `<img src="${B.img}" alt="Nachher">` : `<div class="photo-slot">kein Foto</div>`}</div>
   <div class="row between tiny muted"><span>Vorher</span><span>Nachher</span></div>`}</section>`;
};
async function loadPhotos() { if (S.photosLoading) return; S.photosLoading = true; try { const q = await S.db.collection("members/" + S.uid + "/photos").get(); S.photos = q.docs.map(d => Object.assign({ id: d.id }, d.data())); } catch (e) { S.photos = []; } S.photosLoading = false; render(); }

VIEWS.challenges = () => {

  return `<div class="pageh"><div class="eyebrow">Challenges</div><h1>Punkte sammeln</h1></div>

  <section class="card"><h3>So gibt es Punkte</h3><div class="kv"><span>Training oder Bewegung (max. 2 pro Tag)</span><span>+20</span><span>Mindestens 2 Mahlzeiten getrackt</span><span>+10</span><span>Jedes erreichte Tagesziel</span><span>+3</span><span>Alle Tagesziele geschafft</span><span>+5</span><span>Challenges von ${COACH.name}</span><span>je nach Challenge</span></div></section>
  <section class="card"><h3>Aktuelle Challenges</h3><div class="list">${list.length ? list.map(c => `<div class="li"><div class="grow"><div class="t">${esc(c.title)}</div><div class="s">${esc(c.desc || "")}${c.end ? " · bis " + fmt(c.end) : ""}</div></div><div class="stack" style="gap:6px;align-items:flex-end"><span class="pill gold num">+${num(c.points)}</span><button class="btn small ${done[c.id] ? "quiet" : ""}" data-act="chDone" data-id="${c.id}">${done[c.id] ? "Geschafft ✓" : "Geschafft"}</button></div></div>`).join("") : `<div class="empty">Gerade läuft keine Challenge. ${COACH.name} startet bald eine neue.</div>`}</div></section>

function ctxDate() { return S.mealCtx ? S.mealCtx.date : (S.foodDate || today()); }
function ctxDay() {
  if (!S.mealCtx) return day(ctxDate());
  const { uid, date } = S.mealCtx; const m = S.c.days[uid] ||= {};
  if (!m[date]) m[date] = { date, meals: [], workouts: [], water: 0, steps: 0, sleep: 0, custom: {} };
  m[date].meals ||= []; m[date].workouts ||= []; return m[date];
}
function commitCtxDay() {
  if (!S.mealCtx) { saveDay(ctxDate()); return; }
  const { uid, date } = S.mealCtx; writeNow("members/" + uid + "/days/" + date, Object.assign({}, S.c.days[uid][date], { updated: Date.now() }));
}
function itemFrom(F, grams) { const [n, k, p, c, f, g, lbl] = F; const it = { food: n, grams: grams ?? g, per100: { kcal: k, p, c, f }, conf: "db", pg: g, plabel: lbl }; rescale(it); return it; }
function rescale(it) { if (!it.per100) return; const g = num(it.grams); it.kcal = Math.round(it.per100.kcal * g / 100); it.p = r1(it.per100.p * g / 100); it.c = r1(it.per100.c * g / 100); it.f = r1(it.per100.f * g / 100); }
function setPer100(it) { const g = num(it.grams); if (g > 0) it.per100 = { kcal: num(it.kcal) * 100 / g, p: num(it.p) * 100 / g, c: num(it.c) * 100 / g, f: num(it.f) * 100 / g }; }
const mealSum = items => items.reduce((a, i) => ({ kcal: a.kcal + num(i.kcal), p: a.p + num(i.p), c: a.c + num(i.c), f: a.f + num(i.f) }), { kcal: 0, p: 0, c: 0, f: 0 });
const CONF = { db: ["Datenbank", "good"], ai: ["geschätzt", "warn"], ai_low: ["grob geschätzt", "bad"], own: ["eigene Angabe", "lil"] };
function recentMeals() {
  const seen = new Set(), out = [];
  Object.values(S.days).sort((a, b) => a.date < b.date ? 1 : -1).forEach(D => (D.meals || []).slice().reverse().forEach(m => { const k = (m.name || "").toLowerCase(); if (!k || seen.has(k) || out.length >= 12) return; seen.add(k); out.push(m); }));
  return out;
}
function ownFoods() {
  const map = {}; Object.values(S.days).forEach(D => (D.meals || []).forEach(m => (m.items || []).forEach(i => { if (i.per100 && i.food && i.conf !== "db") map[i.food.toLowerCase()] = i; })));
  return Object.values(map);
}
function newMeal(extra) { return Object.assign({ slot: guessSlot(), items: [], name: "", desc: "", mode: S.imgOK ? "photo" : "search", q: "", mult: 1, fav: false }, extra || {}); }

async function shrink(file, max, q) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const sc = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(img.src);
  return { url: cv.toDataURL("image/jpeg", q), blob: await new Promise(r => cv.toBlob(r, "image/jpeg", q)) };
}
async function analyzeMeal() {
  const m = S.meal; if (!S.sample) return;
  const usePhoto = m.mode === "photo" && m.blob;
  if (!usePhoto && !(m.desc || "").trim()) { m.err = m.mode === "photo" ? "Wähl zuerst ein Foto." : "Beschreib kurz, was du gegessen hast."; drawSheet(); return; }
  m.busy = true; m.err = ""; drawSheet();
  const prompt = `Du bist eine erfahrene Ernährungsberaterin in einer deutschen Fitness-App für Frauen. ${usePhoto ? "Das Bild zeigt eine Mahlzeit." : ""}
Angaben der Nutzerin: ${(m.desc || "keine").slice(0, 600)}
Aufgabe: Bestimme jedes Lebensmittel einzeln und schätze eine realistische Menge in Gramm (Angaben der Nutzerin haben Vorrang). Denk an versteckte Kalorien wie Bratöl, Butter, Dressing oder Soße und führe sie als eigenes Lebensmittel auf, wenn sie wahrscheinlich sind. Nutze übliche deutsche Nährwerttabellen.
Gib für jedes Lebensmittel die Nährwerte pro 100 g an und wie sicher du dir bist.
Antworte ausschließlich mit JSON in genau dieser Form:
{"name":"kurzer deutscher Name","items":[{"food":"Lebensmittel auf Deutsch","grams":0,"kcal100":0,"p100":0,"c100":0,"f100":0,"confidence":"hoch|mittel|niedrig","hint":"optional: was die Nutzerin prüfen sollte, sonst leer"}],"kcal_min":0,"kcal_max":0}`;
  try {
    const opts = { modelTier: "default" }; if (usePhoto && S.imgOK) opts.images = [m.blob];
    const r = await S.sample.json(prompt, opts);
    if (r && Array.isArray(r.items) && r.items.length) {
      const add = r.items.map(i => { const it = { food: String(i.food || ""), grams: Math.round(num(i.grams)), per100: { kcal: num(i.kcal100), p: num(i.p100), c: num(i.c100), f: num(i.f100) }, conf: i.confidence === "niedrig" ? "ai_low" : "ai", hint: String(i.hint || "").slice(0, 160) }; rescale(it); return it; });
      m.items = m.items.concat(add); if (!m.name) m.name = String(r.name || ""); m.range = num(r.kcal_min) && num(r.kcal_max) ? [Math.round(num(r.kcal_min)), Math.round(num(r.kcal_max))] : null; m.mult = 1;
    } else m.err = "Die Schätzung hat nichts Verwertbares geliefert. Such die Lebensmittel lieber in der Datenbank.";
  } catch (e) {
    m.err = sampleErr(e, "Die Schätzung") + " Alternativ: Lebensmittel über die Suche eintragen.";
  }
  m.busy = false; drawSheet();
}

let restIv = null;
function startRest(sec) {
  clearInterval(restIv); if (!sec) return; S.rest = { end: Date.now() + sec * 1000 };
  const tick = () => { const bar = document.getElementById("restBar"), t = document.getElementById("restTxt"); if (!S.rest) { clearInterval(restIv); if (bar) bar.hidden = true; return; }
    const left = Math.round((S.rest.end - Date.now()) / 1000); if (bar) bar.hidden = false;
    if (left <= 0) { if (t) t.textContent = "Pause vorbei, weiter geht's!"; try { navigator.vibrate && navigator.vibrate(300); } catch (e) {} clearInterval(restIv); setTimeout(() => { S.rest = null; const b = document.getElementById("restBar"); if (b) b.hidden = true; }, 4000); return; }
    if (t) t.textContent = "Pause " + Math.floor(left / 60) + ":" + pad(left % 60); };
  tick(); restIv = setInterval(tick, 500);
}

// ---------- Coach ----------
function enterCoach() { S.profile = { name: COACH.name, shareCycle: false, goals: {} }; S.sess = { role: "coach" }; S.c.view = "dash"; subscribeCoach(); render(); }
function subscribeCoach() {
  const db = S.db, on = (ref, fn) => S.unsub.push(ref.onSnapshot(fn, e => console.warn(e)));
  on(db.collection("members"), q => { S.c.members = {}; q.docs.forEach(d => { S.c.members[d.id] = clone(d.data()); if (d.id !== S.uid) subMember(d.id); else if (!pending.has("profile")) S.profile = clone(d.data()); }); S.c.mLoaded = true; mirrorAll(); render(); });
  on(db.collection("coachclients"), q => { q.docs.forEach(d => S.c.masters[d.id] = clone(d.data())); S.c.msLoaded = true; mirrorAll(); render(); });
  on(db.doc("club/challenges"), s => { S.challenges = s.exists ? s.data() : { list: [] }; render(); });
  on(db.collection("scores"), q => { S.scores = {}; q.docs.forEach(d => S.scores[d.id] = d.data()); render(); });
  on(db.doc("club/recipes"), s => { S.recipes = s.exists ? (s.data().list || []) : []; render(); });
  on(db.doc("club/knowledge"), s => { if (!S.c.kPrev) S.knowledge = s.exists ? (s.data().list || []) : []; render(); });
  on(db.doc("club/foods"), s => { S.clubFoods = s.exists ? (s.data().list || []) : []; render(); });
  on(db.doc("data/users/" + S.uid + "/cycle"), s => { if (!pending.has("cycle")) { S.cycle = s.exists ? clone(s.data()) : null; render(); } });
}
function subMember(uid) {
  if (S.c.subbed[uid]) return; S.c.subbed[uid] = 1; const db = S.db, on = (ref, fn) => S.unsub.push(ref.onSnapshot(fn, e => console.warn(e)));
  on(db.collection("members/" + uid + "/days").orderBy("date", "desc").limit(90), q => { const m = {}; q.docs.forEach(d => m[d.id] = d.data()); S.c.days[uid] = m; render(); });
  on(db.collection("members/" + uid + "/measures"), q => { const m = {}; q.docs.forEach(d => m[d.id] = d.data()); S.c.measures[uid] = m; render(); });
  on(db.doc("members/" + uid + "/shared/cycle"), s => { S.c.shared[uid] = s.exists ? s.data() : null; render(); });
}
function uidFor(key) { const l = Object.entries(S.c.members).filter(([, p]) => p.key === key).sort((a, b) => (a[1].lastSeen || "") < (b[1].lastSeen || "") ? 1 : -1); return l[0]?.[0] || null; }
const mirrorChecked = new Set();
async function mirrorAll() {
  if (!S.c.mLoaded || !S.c.msLoaded) return;
  for (const [key, m] of Object.entries(S.c.masters)) {
    const uid = uidFor(key); if (!uid || mirrorChecked.has(uid + key)) continue; mirrorChecked.add(uid + key);
    try { const s = await S.db.doc("members/" + uid + "/coach/inbox").get(); if (!s.exists || s.data().rev !== m.rev) await S.db.doc("members/" + uid + "/coach/inbox").set(m); } catch (e) { console.warn(e); }
  }
}
const blankMaster = key => normMaster({ key, plan: { title: "", meta: {}, blocks: [], exercises: [], note: "" }, nutrition: { kcal: "", protein: "", carbs: "", fat: "", text: "", meals: [] }, appointments: [], invoices: [], message: "" });
function draft(key) { if (!S.c.draft[key]) S.c.draft[key] = normMaster(Object.assign(blankMaster(key), clone(S.c.masters[key] || {}))); return S.c.draft[key]; }
async function saveMaster(key) {
  const m = draft(key); m.rev = Date.now(); m.key = key; m.plan.updated = today();
  const ok = await writeNow("coachclients/" + key, m); if (!ok) return;
  S.c.masters[key] = clone(m); const uid = uidFor(key); if (uid) await writeNow("members/" + uid + "/coach/inbox", m);
  S.c.dirty = false; if (key === "__lisa") { toast("Dein Plan ist gespeichert"); render(); return; } toast(uid ? "Gespeichert und an " + clientName(key) + " geschickt" : "Gespeichert. " + clientName(key) + " sieht es nach dem ersten Login."); render();
}

  return `<section class="card"><div class="eyebrow">Dein Training heute</div><h3>${LVL[ad.lvl].n}</h3><p class="small">${esc(LVL[ad.lvl].t)}</p>${ad.why.length ? `<p class="small muted">${ad.why.map(esc).join(" ")}</p>` : ""}<ul class="small" style="margin:0;padding-left:18px">${ad.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul><p class="tiny muted">Genau diese Empfehlung sehen die Mädels in ihrer App. So kannst du testen, was ihnen hilft und was fehlt.</p></section>` + VIEWS.cycle().replace("Dein Zyklus</h1>", "Mein Zyklus</h1>").replace("Zyklus · privat</div>", "Zyklus · nur für dich</div>");
}
function coachChallenges() {
  if (!S.c.ch) S.c.ch = clone(S.challenges?.list || []);
  const done = id => Object.values(S.c.members).filter(p => p.challenges?.[id]).map(p => p.name);
  return `<div class="pageh"><div class="eyebrow">Challenges</div><h1>Punkte für alle</h1><p class="small muted">Jede Kundin sieht aktive Challenges und hakt sie selbst ab. Die Punkte fließen in die Club-Rangliste.</p></div>
  ${S.c.ch.map((c, i) => `<section class="card"><div class="grid2" style="grid-template-columns:2fr 1fr"><div class="field"><label for="ch${i}t">Titel</label><input class="inp" id="ch${i}t" data-ch="${i}.title" value="${esc(c.title)}"></div><div class="field"><label for="ch${i}p">Punkte</label><input class="inp num" id="ch${i}p" data-ch="${i}.points" value="${esc(c.points)}"></div></div>
   <div class="field"><label for="ch${i}d">Beschreibung</label><input class="inp" id="ch${i}d" data-ch="${i}.desc" value="${esc(c.desc || "")}"></div>
   <div class="grid3" style="align-items:end"><div class="field"><label for="ch${i}s">Start</label><input class="inp" type="date" id="ch${i}s" data-ch="${i}.start" value="${esc(c.start || "")}"></div><div class="field"><label for="ch${i}e">Ende</label><input class="inp" type="date" id="ch${i}e" data-ch="${i}.end" value="${esc(c.end || "")}"></div><button class="btn small danger" data-act="chDel" data-i="${i}">Entfernen</button></div>
   <p class="tiny muted">Geschafft: ${esc(done(c.id).join(", ") || "noch niemand")}</p></section>`).join("")}
  <button class="btn quiet" data-act="chAdd">+ Neue Challenge</button><button class="btn block" data-act="chSave">Challenges speichern</button>`;
}
function coachClients() {
  const cl = S.config?.clients || [];
  return `<div class="pageh"><div class="eyebrow">Zugänge</div><h1>Kundinnen</h1><p class="small muted">Jede Kundin meldet sich mit ihrer E-Mail-Adresse und ihrem Passwort an. Inaktive Kundinnen können sich nicht anmelden.</p></div>
  ${cl.map((c, i) => `<section class="card"><div class="row between"><h3>${esc(c.name)}</h3><div class="row">${uidFor(c.key) ? `<span class="pill good">angemeldet</span>` : `<span class="pill">noch nicht angemeldet</span>`}<button class="btn small ${c.active === false ? "" : "quiet"}" data-act="toggleActive" data-i="${i}">${c.active === false ? "Aktivieren" : "Deaktivieren"}</button></div></div>
   <div class="row" style="flex-wrap:nowrap"><input class="inp" id="nem${i}" type="email" autocapitalize="none" placeholder="E-Mail-Adresse" value="${esc(c.email || "")}"><button class="btn small ghost" data-act="setEmail" data-i="${i}">E-Mail speichern</button></div>${c.email ? "" : `<p class="tiny" style="color:var(--warn)">Noch keine E-Mail hinterlegt. Bis dahin meldet sie sich mit ihrem Vornamen an.</p>`}
   <div class="row" style="flex-wrap:nowrap"><input class="inp" id="npw${i}" placeholder="Neues Passwort"><button class="btn small ghost" data-act="setPw" data-i="${i}">Passwort setzen</button></div></section>`).join("")}
  <section class="card"><h3>Neue Kundin</h3><div class="grid2"><input class="inp" id="newName" placeholder="Vorname"><input class="inp" id="newPw" placeholder="Passwort"></div><input class="inp" id="newEmail" type="email" autocapitalize="none" placeholder="E-Mail-Adresse"><button class="btn small" data-act="addClient" style="align-self:flex-start">Anlegen</button></section>
  <section class="card"><h3>Dein Coach-Passwort</h3><div class="row" style="flex-wrap:nowrap"><input class="inp" id="coachPw" placeholder="Neues Coach-Passwort"><button class="btn small ghost" data-act="setCoachPw">Ändern</button></div></section>
  <div class="banner">${I.info}<div class="grow small">Neue Kundin: Vorname, E-Mail und Passwort hier anlegen, dann ihr den Link zur App und ihr Passwort schicken. Hat sie ihr Passwort vergessen, setzt du hier ein neues. Ein Claude-Konto braucht sie nicht.</div></div>`;
}
async function saveConfig(cfg) { const ok = await writeNow("club/config", cfg); if (ok) toast("Gespeichert"); }

// ---------- Ereignisse ----------
document.addEventListener("submit", e => { if (e.target.id === "loginForm") { e.preventDefault(); doLogin(); } });
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === "veil") { if (e.target === el) closeLayer(); return; }
  switch (a) {
    case "closeModal": case "closeLayer": closeLayer(); break;
    case "pick": loginSel = d.k; loginErr = ""; render(); setTimeout(() => $("#pw")?.focus(), 50); break;
    case "logout": logout(); break;
    case "tab": if (S.sess?.role === "coach") { S.c.view = "me"; S.c.meTab = { training: "training", cycle: "cycle", food: "food", home: "heute" }[d.r] || "heute"; render(); window.scrollTo(0, 0); break; } S.stack = []; S.route = d.r; window.scrollTo(0, 0); render(); break;
    case "go": closeLayer(); if (S.sess?.role === "coach") { if (d.r === "knowledge") S.c.view = "knowledge"; else if (ME_ROUTES.includes(d.r)) { S.c.view = "me"; S.c.meTab = d.r; } render(); window.scrollTo(0, 0); } else go(d.r); break;
    case "tip": showTip(); break;
    case "back": S.route = S.stack.pop() || "home"; render(); break;
    case "water": { const D = day(today()); D.water = Math.max(0, num(D.water) + num(d.v)); saveDay(today()); render(); break; }
    case "custom": { const D = day(today()); D.custom[ck(d.c)] = !D.custom[ck(d.c)]; saveDay(today()); render(); break; }
    case "addMeal": S.mealCtx = null; S.meal = newMeal({ mode: d.mode || (S.imgOK ? "photo" : "search"), slot: d.slot || guessSlot() }); sheet(mealSheet); break;
    case "editMeal": { S.mealCtx = null; const m = ctxDay().meals.find(x => x.id === d.id); if (m) openMealEdit(m); break; }
    case "cEditMeal": { const uid = uidFor(S.c.sel); S.mealCtx = { uid, date: d.d, name: clientName(S.c.sel) }; const m = ctxDay().meals.find(x => x.id === d.id); if (m) openMealEdit(m); break; }
    case "cAddMeal": { const uid = uidFor(S.c.sel); const dd = d.d || $("#cfd")?.value || today(); S.mealCtx = { uid, date: dd, name: clientName(S.c.sel) }; S.meal = newMeal({ mode: "search" }); sheet(mealSheet); break; }
    case "repeatMeal": { const src = day(S.foodDate || today()).meals.find(x => x.id === d.id); if (src) { const D = day(today()); const cp = clone(src); cp.id = uidGen(); cp.at = Date.now(); delete cp.byCoach; D.meals.push(cp); saveDay(today()); toast("Für heute eingetragen"); render(); } break; }
    case "mSlot": S.meal.slot = d.v; drawSheet(); break;
    case "mMode": S.meal.mode = d.v; S.meal.err = ""; drawSheet(); if (d.v === "search") setTimeout(() => $("#mq")?.focus(), 60); break;
    case "mMult": { const m = S.meal, f = num(d.v) / (m.mult || 1); m.items.forEach(it => { it.grams = Math.round(num(it.grams) * f); if (it.per100) rescale(it); else { ["kcal", "p", "c", "f"].forEach(k => it[k] = r1(num(it[k]) * f)); } }); m.mult = num(d.v); drawSheet(); break; }
    case "gStep": { const it = S.meal.items[+d.i]; if (!it.per100) setPer100(it); it.grams = Math.max(0, num(it.grams) + num(d.v)); rescale(it); drawSheet(); break; }
    case "gPortion": { const it = S.meal.items[+d.i]; it.grams = it.pg; rescale(it); drawSheet(); break; }
    case "mEdit": { const it = S.meal.items[+d.i]; it.open = !it.open; drawSheet(); break; }
    case "addFood": { const F = FOODS.find(x => x[0] === d.f); if (F) { S.meal.items.push(itemFrom(F)); S.meal.q = ""; drawSheet(); toast(F[0] + " hinzugefügt"); } break; }
    case "addOwn": { const o = ownFoods().find(x => x.food === d.f); if (o) { const it = clone(o); it.open = false; S.meal.items.push(it); S.meal.q = ""; drawSheet(); } break; }
    case "useFav": { const f = S.profile.favs[+d.i]; S.meal.items = S.meal.items.concat(clone(f.items)); if (!S.meal.name) S.meal.name = f.name; S.meal.slot = f.slot || S.meal.slot; drawSheet(); break; }
    case "delFav": S.profile.favs.splice(+d.i, 1); saveProfile(); drawSheet(); break;
    case "useRecent": { let r = null; Object.values(S.days).forEach(D => (D.meals || []).forEach(m => { if (m.id === d.id) r = m; })); if (r) { S.meal.items = S.meal.items.concat(clone(r.items || [{ food: r.name, grams: "", kcal: r.kcal, p: r.p, c: r.c, f: r.f, conf: "own" }])); S.meal.items.forEach(i => { if (!i.per100 && num(i.grams) > 0) setPer100(i); }); if (!S.meal.name) S.meal.name = r.name; if (r.thumb && !S.meal.thumb) S.meal.thumb = r.thumb; drawSheet(); } break; }
    case "addItem": S.meal.items.push({ food: "", grams: 100, kcal: "", p: "", c: "", f: "", conf: "own", open: true }); drawSheet(); break;
    case "delItem": S.meal.items.splice(+d.i, 1); drawSheet(); break;
    case "analyze": analyzeMeal(); break;
    case "saveMeal": { const m = S.meal; if (!m.items.length) { m.err = "Füg mindestens ein Lebensmittel hinzu."; drawSheet(); break; } const sum = mealSum(m.items);
      const rec = { id: m.id || uidGen(), slot: m.slot, name: m.name || m.items.map(i => i.food).filter(Boolean).join(", ") || "Mahlzeit", items: m.items.map(i => ({ food: i.food, grams: num(i.grams), kcal: Math.round(num(i.kcal)), p: r1(num(i.p)), c: r1(num(i.c)), f: r1(num(i.f)), per100: i.per100 || null, conf: i.conf || "own", pg: i.pg || null, plabel: i.plabel || null })), kcal: Math.round(sum.kcal), p: r1(sum.p), c: r1(sum.c), f: r1(sum.f), thumb: m.thumb || null, at: m.at || Date.now() };
      if (S.mealCtx) rec.byCoach = true;
      const D = ctxDay(); const ix = D.meals.findIndex(x => x.id === rec.id); if (ix >= 0) D.meals[ix] = rec; else D.meals.push(rec); commitCtxDay();
      if (m.fav && !S.mealCtx) { const favs = S.profile.favs ||= []; if (!favs.some(f => f.name === rec.name)) { favs.unshift({ name: rec.name, slot: rec.slot, items: rec.items }); favs.splice(40); saveProfile(); } }
      closeLayer(); toast("Eingetragen"); render(); break; }
    case "delMeal": { const D = ctxDay(); D.meals = D.meals.filter(x => x.id !== S.meal.id); commitCtxDay(); closeLayer(); render(); break; }
    case "foodDay": { const nd = addD(S.foodDate || today(), num(d.v)); if (nd <= today()) { S.foodDate = nd; render(); } break; }
    case "startWs": { const plan = S.inbox?.plan || {}; const bl = planBlocks(plan)[+d.b || 0] || { name: "Training", list: plan.exercises || [] }; startWorkout({ title: bl.name || plan.title || "Training nach Plan", list: bl.list, finisher: plan.meta?.finisher || "" }); break; }
    case "quickWs": S.ws = { quick: true, title: "Krafttraining", date: today(), duration: "", note: "" }; sheet(quickSheet); break;
    case "qType": S.ws.title = d.v; drawSheet(); break;
    case "setDone": { const ex = S.ws.exercises[+d.ei], s = ex.sets[+d.si]; s.done = !s.done; drawSheet(); if (s.done) startRest(restSec(ex.rest)); break; }
    case "addSet": { const e2 = S.ws.exercises[+d.ei]; const last = e2.sets[e2.sets.length - 1] || { reps: "", kg: "" }; e2.sets.push({ reps: last.reps, kg: last.kg, done: false }); drawSheet(); break; }
    case "delEx": S.ws.exercises.splice(+d.ei, 1); drawSheet(); break;
    case "addEx": S.ws.exercises.push({ name: "Neue Übung", sets: [{ reps: "10", kg: "", done: false }] }); drawSheet(); break;
    case "wsFeel": S.ws.feel = +d.v; drawSheet(); break;
    case "saveWs": saveWorkout(); break;
    case "saveQuick": saveQuickWs(); break;
    case "viewWs": { const w = S.days[d.d].workouts[+d.i]; sheet(() => `<div class="row between"><div><div class="eyebrow">${fmtLong(d.d)}</div><h2>${esc(w.title)}</h2></div><button class="iconbtn" data-act="closeLayer" aria-label="Schließen">✕</button></div>${trackerLine(w)}${(w.exercises || []).map(e => `<div class="row between small" style="border-top:1px solid var(--line);padding-top:8px"><b class="gold">${esc(e.name)}</b><span class="num">${e.sets.map(x => `${esc(x.reps)}${x.kg ? "×" + esc(x.kg) + " kg" : ""}${x.done ? " ✓" : ""}`).join(" · ")}</span></div>`).join("")}${w.duration ? `<p class="small">${w.duration} Minuten</p>` : ""}${w.note ? `<p class="small">${esc(w.note)}</p>` : ""}<button class="btn danger" data-act="delWs" data-d="${d.d}" data-i="${d.i}">Eintrag löschen</button>`); break; }
    case "delWs": { S.days[d.d].workouts.splice(+d.i, 1); saveDay(d.d); closeLayer(); render(); break; }
    case "book": S.book = { type: "1:1 Training", date: "", time: "", note: "" }; sheet(bookSheet); break;
    case "bType": S.book.type = d.v; drawSheet(); break;
    case "copyNum": try { await navigator.clipboard.writeText(COACH.phoneShow); toast("Nummer kopiert"); } catch (er) { toast(COACH.phoneShow); } break;
    case "cycleSetup": { const st = $("#cs1").value || today(); const pl = Math.max(1, num($("#cs2").value) || 5); const c = cyc(); c.settings = { len: num($("#cs3").value) || 28, plen: pl, contra: $("#cs4").value }; c.periods = [{ start: st, end: addD(st, pl - 1) }]; saveCycle(); render(); toast("Dein Zyklus ist eingerichtet"); break; }
    case "calSel": S.calSel = d.d; render(); break;
    case "calMove": { const [y, m] = (S.calMonth || monthKey()).split("-").map(Number); const nd = new Date(y, m - 1 + num(d.v), 1); S.calMonth = nd.getFullYear() + "-" + pad(nd.getMonth() + 1); render(); break; }
    case "cy": { const sel = S.calSel || today(); const c = cyc(); const e2 = c.days[sel] ||= {}; const v = d.k === "discharge" ? d.v : num(d.v); e2[d.k] = e2[d.k] === v && d.k === "discharge" ? null : v; if (d.k === "flow") syncFlow(sel, v); saveCycle(); render(); break; }
    case "cyT": { const sel = S.calSel || today(); const c = cyc(); const e2 = c.days[sel] ||= {}; const arr = e2[d.k] ||= []; const ix = arr.indexOf(d.v); if (ix >= 0) arr.splice(ix, 1); else arr.push(d.v); saveCycle(); render(); break; }
    case "perStart": { const sel = S.calSel || today(); const c = cyc(); const e2 = c.days[sel] ||= {}; if (num(e2.flow) < 2) e2.flow = 3; if (!inPeriod(sel)) c.periods.push({ start: sel, end: sel }); else syncFlow(sel, 3); saveCycle(); render(); toast("Periode eingetragen"); break; }
    case "perEnd": perEndAt(S.calSel || today()); break;
    case "shareCycle": { S.profile.shareCycle = el.checked; saveProfile(); if (el.checked) writeNow("members/" + S.uid + "/shared/cycle", sharedCycle()); else delNow("members/" + S.uid + "/shared/cycle"); toast(el.checked ? "Zyklus wird mit Lisa-Marie geteilt" : "Teilen beendet"); render(); break; }
    case "saveMeasure": { const v = num($("#ms_" + d.k)?.value); if (!v) { toast("Bitte einen Wert eintragen"); break; } const t = S.mDate || today(); S.measures[t] = Object.assign({ date: t }, S.measures[t] || {}, { [d.k]: v }); persist("m:" + t, "members/" + S.uid + "/measures/" + t, () => S.measures[t], 100); toast("Gespeichert"); render(); break; }
    case "saveAllMeasures": { const vals = readMeasureForm(d.p); if (!Object.keys(vals).length) { toast("Bitte mindestens einen Wert eintragen"); break; }
      if (d.p === "cm_") { const t = S.mDate || today(); S.measures[t] = Object.assign({ date: t }, S.measures[t] || {}, vals); persist("m:" + t, "members/" + S.uid + "/measures/" + t, () => S.measures[t], 50); }
      else { const uid = uidFor(S.c.sel), t = S.c.mDate || today(); const ms = S.c.measures[uid] ||= {}; ms[t] = Object.assign({ date: t }, ms[t] || {}, vals, { byCoach: true }); await writeNow("members/" + uid + "/measures/" + t, ms[t]); }
      toast("Messung gespeichert"); render(); break; }
    case "mLoad": if (d.p === "cm_") { S.mDate = d.d; } else if (d.p === "co_") { S.c.mDate = d.d; } render(); window.scrollTo(0, 0); break;
    case "mDel": if (layer.innerHTML === "") { modal(`<h3>Messung vom ${fmt(d.d, { day: "2-digit", month: "2-digit", year: "numeric" })} löschen?</h3><div class="row" style="justify-content:center"><button class="btn quiet" data-act="closeModal">Abbrechen</button><button class="btn danger" data-act="mDelOk" data-p="${d.p}" data-d="${d.d}">Löschen</button></div>`); } break;
    case "mDelOk": { if (d.p === "cm_") { delete S.measures[d.d]; await delNow("members/" + S.uid + "/measures/" + d.d); } else { const uid = uidFor(S.c.sel); delete (S.c.measures[uid] || {})[d.d]; await delNow("members/" + uid + "/measures/" + d.d); } closeLayer(); toast("Gelöscht"); render(); break; }
    case "histMove": { const nm = shiftMonth(S.histM || monthKey(), num(d.v)); if (nm <= monthKey()) { S.histM = nm; render(); } break; }
    case "chistMove": { const nm = shiftMonth(S.c.histM || monthKey(), num(d.v)); if (nm <= monthKey()) { S.c.histM = nm; render(); } break; }
    case "csv": { const dl = await window.claude.use("downloads"); if (!dl) { toast("Speichern ist in dieser Ansicht nicht möglich"); break; } try { await dl.save(csvMonth(uidFor(S.c.sel), d.m, clientName(S.c.sel))); } catch (er) { if (er.code !== "cancelled") toast("Speichern hat nicht geklappt"); } break; }
    case "wsComment": { const uid = uidFor(S.c.sel); const w = (S.c.days[uid][d.d].workouts || []).find(x => x.id === d.id); if (!w) break; S.wsc = { uid, date: d.d, id: d.id, text: w.coachNote || "" }; sheet(() => `<div class="row between"><h2>Kommentar für ${esc(clientName(S.c.sel))}</h2><button class="iconbtn" data-act="closeLayer" aria-label="Schließen">✕</button></div><p class="small muted">${esc(w.title)} am ${fmtLong(d.d)}. Sie sieht deinen Kommentar in ihrem Trainingsverlauf.</p><textarea class="inp" id="wscText" data-wsc="1" placeholder="z. B. Super Technik beim Hip Thrust, nächstes Mal 2,5 kg mehr!">${esc(S.wsc.text)}</textarea><button class="btn block" data-act="wsCommentSave">Speichern</button>`); break; }
    case "wsCommentSave": { const { uid, date, id, text } = S.wsc; const D = S.c.days[uid][date]; const w = D.workouts.find(x => x.id === id); if (w) { w.coachNote = text.trim(); await writeNow("members/" + uid + "/days/" + date, Object.assign({}, D, { updated: Date.now() })); toast("Kommentar gespeichert"); } closeLayer(); render(); break; }
    case "wsDelCoach": { const uid = uidFor(S.c.sel); const D = S.c.days[uid][d.d]; D.workouts = (D.workouts || []).filter(x => x.id !== d.id); await writeNow("members/" + uid + "/days/" + d.d, Object.assign({}, D, { updated: Date.now() })); toast("Training gelöscht"); render(); break; }
    case "cEditProf": { const uid = uidFor(S.c.sel); S.cp = clone(S.c.members[uid]); S.cp.personal ||= {}; S.cp.goals ||= {}; sheet(coachProfSheet); break; }
    case "cSaveProf": { const uid = uidFor(S.c.sel); S.cp.goals.custom = (S.cp.goals.customText || "").split("\n").map(x => x.trim()).filter(Boolean); delete S.cp.goals.customText; ["water", "steps", "sleep"].forEach(k => { if (S.cp.goals[k] !== "" && S.cp.goals[k] != null) S.cp.goals[k] = num(S.cp.goals[k]); }); if (await writeNow("members/" + uid, S.cp)) { S.c.members[uid] = clone(S.cp); toast("Angaben gespeichert"); } closeLayer(); render(); break; }
    case "cmpPose": S.cmp = Object.assign(S.cmp || {}, { pose: d.v }); if (!S.cmp.a) { const ds2 = [...new Set(S.photos.map(p => p.date))].sort(); S.cmp.a = ds2[0]; S.cmp.b = ds2[ds2.length - 1]; } render(); break;
    case "chDone": { const ch = S.profile.challenges ||= {}; if (ch[d.id]) delete ch[d.id]; else ch[d.id] = today(); saveProfile(); queueScore(); render(); break; }
    case "addCustom": (S.profile.goals.custom ||= []).push("Neues Ziel"); saveProfile(); render(); break;
    case "delCustom": S.profile.goals.custom.splice(+d.i, 1); saveProfile(); render(); break;
    // Coach
    case "cview": S.c.view = d.v; if (d.v === "wissen") { S.c.kn = null; S.c.kPrev = false; } if (d.v === "challenges") S.c.ch = null; render(); window.scrollTo(0, 0); break;
    case "openClient": S.c.sel = d.k; S.c.tab = "persoenlich"; S.c.view = "client"; S.c.draft = {}; S.c.dirty = false; render(); window.scrollTo(0, 0); break;
    case "ctab": S.c.tab = d.v; render(); break;
    case "exAdd": draft(S.c.sel).plan.exercises.push({ block: d.b ?? (draft(S.c.sel).plan.exercises.slice(-1)[0]?.block || ""), name: "", sets: "3", reps: "10–12", rest: "45 Sek.", weight: "", how: "", cnote: "" }); S.c.dirty = true; render(); break;
    case "exDel": draft(S.c.sel).plan.exercises.splice(+d.i, 1); S.c.dirty = true; render(); break;
    case "exMove": { const L = draft(S.c.sel).plan.exercises, i = +d.i; if (i > 0) [L[i - 1], L[i]] = [L[i], L[i - 1]]; S.c.dirty = true; render(); break; }
    case "apAdd": draft(S.c.sel).appointments.push({ id: uidGen(), date: today(), time: "18:00", type: "1:1 Training", note: "" }); S.c.dirty = true; render(); break;

const CATS = ["Frühstück", "Mittagessen", "Snack", "Abendessen"];
function catOf(slot) { const s = String(slot || "").toLowerCase(); if (/früh/.test(s)) return 0; if (/snack|nachmittag|zwischen|vormittag/.test(s)) return 2; if (/mittag/.test(s)) return 1; if (/abend/.test(s)) return 3; return -1; }
const blankOpt = i => ({ id: uidGen(), label: String.fromCharCode(65 + i), name: "", ingredients: [], prep: "", kcal: "", p: "", c: "", f: "" });
function normMeals(list) {
  const out = CATS.map(c => ({ id: "cat-" + c, slot: c, kcal: "", protein: "", options: [] })), extra = [];
  list.forEach(m => { const i = catOf(m.slot); const tgt = i >= 0 ? out[i] : null; if (!tgt) { extra.push(m); return; } if (m.id && !m.id.startsWith("cat-") && tgt.options.length) {} tgt.options = tgt.options.concat(m.options || []); if (!num(tgt.kcal) && num(m.kcal)) tgt.kcal = m.kcal; if (!num(tgt.protein) && num(m.protein)) tgt.protein = m.protein; if (m.note) tgt.note = m.note; });
  out.forEach(o => { if (!o.options.length) o.options = [0, 1, 2, 3].map(blankOpt); });
  out.forEach((o, i) => { const src = list.find(m => catOf(m.slot) === i); if (src?.note) o.note = src.note; o.order = (i + 1) * 10; });

}

// Messungen: Startwerte (Steckbrief) + von Lisa nachgetragene Check-ups (master.checkups) + Einträge der Kundin (members/<uid>/measures)
function withStart(ms, x) {
  const intake = x?.intake !== undefined || x?.checkups !== undefined ? x.intake : x; const cks = x?.checkups || {};
  const o = {}; const st = intake?.startM, d = intake?.start;
  if (st && d && Object.values(st).some(v => num(v))) o[d] = Object.assign({ date: d, _start: true }, st);
  Object.entries(cks).forEach(([dt, v]) => { o[dt] = Object.assign({ date: dt, _m: true, checkup: true }, v); });
  Object.entries(ms || {}).forEach(([dt, v]) => { o[dt] = Object.assign({}, o[dt] && !o[dt]._start ? o[dt] : {}, v); });
  return o;
}
const lastOfMonth = m => { const [y, mo] = m.split("-").map(Number); return ds(new Date(y, mo, 0)); };
function dueMonth() { const t = parse(today()), m = monthKey(); if (t.getDate() <= 7) return shiftMonth(m, -1); if (diffD(today(), lastOfMonth(m)) <= 2) return m; return null; }
function checkupFor(all, m) { return Object.values(all).filter(v => v.checkup && (v.month || v.date.slice(0, 7)) === m).sort((a, b) => a.date < b.date ? 1 : -1)[0] || null; }
function ckMonths(all, intake) { const first = intake?.start ? intake.start.slice(0, 7) : Object.keys(all).sort()[0]?.slice(0, 7) || monthKey(); const out = []; let m = first; while (m <= monthKey() && out.length < 36) { out.push(m); m = shiftMonth(m, 1); } return out.reverse(); }
function checkupCard(all, intake, coach, name) {
  const months = ckMonths(all, intake), start = Object.values(all).find(v => v._start);
  const delta = (v, k) => { if (!start || !num(start[k]) || !num(v[k])) return ""; const d = r1(num(v[k]) - num(start[k])); return d ? ` <span class="tiny" style="color:${d < 0 ? "var(--good)" : "var(--muted)"}">${d > 0 ? "+" : ""}${fmtV(d)}</span>` : ""; };
  return `<section class="card"><div class="row between"><div><div class="eyebrow">Jedes Monatsende</div><h2>Monats-Check-up</h2></div><button class="btn small" data-act="ckOpen" data-m="${dueMonth() || monthKey()}">${I.ruler} Check-up eintragen</button></div>
   <p class="small muted">${coach ? `Trag hier Check-ups für ${esc(name)} ein oder nach, auch für vergangene Monate.` : `Am Monatsende misst du Gewicht und Maße und trägst sie hier ein. ${COACH.name} sieht sie sofort.`}</p>
   <div class="list">${months.map(m => { const c = checkupFor(all, m); return `<div class="li"><div class="grow"><div class="t">${monthName(m)}</div>${c ? `<div class="s num">gemessen am ${fmt(c.date, { day: "2-digit", month: "2-digit", year: "numeric" })}${c.byCoach || c._m ? " · von Lisa-Marie eingetragen" : ""}</div><div class="s num">${MEASURES.filter(M => num(c[M.k])).map(M => `${M.n} ${fmtV(c[M.k])}${M.k === "weight" ? " kg" : ""}${delta(c, M.k)}`).join(" · ")}</div>` : `<div class="s">noch offen</div>`}</div>${c ? `<button class="linkbtn" data-act="ckOpen" data-m="${m}" data-d="${c.date}">Ändern</button>` : `<button class="btn small ${m === dueMonth() ? "" : "quiet"}" data-act="ckOpen" data-m="${m}">Eintragen</button>`}</div>`; }).join("")}</div>
   ${start ? `<p class="tiny muted">Kleine Zahlen: Veränderung seit dem Start am ${fmt(start.date, { day: "2-digit", month: "2-digit", year: "numeric" })}.</p>` : ""}</section>`;
}
function ckSheet() {
  const c = S.ck;
  return `<div class="row between" style="flex-wrap:nowrap"><div><div class="eyebrow">Monats-Check-up${c.coach ? " · " + esc(clientName(S.c.sel)) : ""}</div><h2>${monthName(c.month)}</h2></div><button class="iconbtn" data-act="closeLayer" aria-label="Schließen" style="flex:none">✕</button></div>
   <div class="grid2"><div class="field"><label for="ckm">Monat</label><select class="inp" id="ckm" data-ck="month">${ckMonths(c.all, c.intake).map(m => `<option value="${m}" ${m === c.month ? "selected" : ""}>${monthName(m)}</option>`).join("")}</select></div><div class="field"><label for="ckd">Gemessen am</label><input class="inp" type="date" id="ckd" data-ck="date" value="${c.date}" max="${today()}"></div></div>
   <div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:12px">${bodySvg(null, true, 86)}<div class="grid2" style="flex:1;min-width:0">${MEASURES.map(M => `<div class="field"><label for="ck_${M.k}">${M.line ? MEASURES.filter(x => x.line).indexOf(M) + 1 + " · " : ""}${M.n} (${M.u})</label><input class="inp num" id="ck_${M.k}" data-ckv="${M.k}" inputmode="decimal" value="${fmtV(c.vals[M.k])}"></div>`).join("")}</div></div>

   <div class="field"><label for="ckn">Notiz${c.coach ? "" : " für Lisa-Marie"}</label><textarea class="inp" id="ckn" data-ck="note" style="min-height:56px" placeholder="z. B. Periode gerade, fühle mich aufgebläht">${esc(c.note || "")}</textarea></div>
   ${c.err ? `<p class="small" style="color:var(--warn)">${esc(c.err)}</p>` : ""}
   <div class="row">${c.existing ? `<button class="btn danger" data-act="ckDel">Löschen</button>` : ""}<button class="btn" style="flex:1" data-act="ckSave">Check-up speichern</button></div>
   ${c.coach ? "" : `<p class="tiny muted">Tipp: Mach am selben Tag auch deine Vorher-/Nachher-Fotos unter „Mehr“.</p>`}`;
}
function ckOpen(m, d, coach) {
  const key = S.c.sel, uid = coach ? uidFor(key) : S.uid;
  const all = coach ? withStart(uid ? (S.c.measures[uid] || {}) : {}, draft(key)) : withStart(S.measures, S.inbox);
  const intake = coach ? draft(key).intake : S.inbox?.intake;
  const ex = d ? all[d] : checkupFor(all, m);
  const date = ex?.date || (m < monthKey() ? lastOfMonth(m) : today());
  S.ck = { coach, uid, month: m, date, vals: ex ? Object.fromEntries(MEASURES.map(M => [M.k, ex[M.k] ?? ""])) : {}, note: ex?.note || "", existing: ex ? { date: ex.date, src: ex._m ? "master" : "member" } : null, all, intake };
  sheet(ckSheet);
}
async function ckSave() {
  const c = S.ck; const vals = {}; MEASURES.forEach(M => { const v = num(c.vals[M.k]); if (v) vals[M.k] = v; });
  if (!Object.keys(vals).length) { c.err = "Bitte mindestens einen Wert eintragen."; drawSheet(); return; }
  if (!c.date || c.date > today()) { c.err = "Bitte ein gültiges Datum wählen."; drawSheet(); return; }
  const rec = Object.assign({ date: c.date, month: c.month, checkup: true, note: c.note || "" }, vals);
  if (c.existing && c.existing.date !== c.date) await ckRemove(c.existing);
  if (!c.coach) { S.measures[c.date] = rec; await writeNow("members/" + S.uid + "/measures/" + c.date, rec); }
  else if (c.uid) { rec.byCoach = true; const ms = S.c.measures[c.uid] ||= {}; ms[c.date] = rec; await writeNow("members/" + c.uid + "/measures/" + c.date, rec); }
  else { const m = draft(S.c.sel); m.checkups ||= {}; m.checkups[c.date] = rec; await saveMaster(S.c.sel); }
  closeLayer(); toast("Check-up " + monthName(c.month) + " gespeichert"); render();
}
async function ckRemove(ex) {
  if (ex.src === "master") { const m = draft(S.c.sel); if (m.checkups) delete m.checkups[ex.date]; await saveMaster(S.c.sel); }
  else if (S.ck.coach) { delete (S.c.measures[S.ck.uid] || {})[ex.date]; await delNow("members/" + S.ck.uid + "/measures/" + ex.date); }
  else { delete S.measures[ex.date]; await delNow("members/" + S.uid + "/measures/" + ex.date); }
}
function ckReminder() {

  const m = dueMonth(); if (!m || !S.profile) return ""; const all = withStart(S.measures, S.inbox); if (checkupFor(all, m)) return "";

}

// ---------- Wochenplan ----------
const WD = ["", "Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"], WDL = ["Flexibel", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const KINDS = { plan: ["Plan-Einheit", "dumb"], dance: ["Tanzen", "star"], run: ["Laufen", "spark"], hiit: ["HIIT / Tabata", "spark"], mobility: ["Mobility", "spark"], other: ["Sonstiges", "spark"] };
const isoDay = d => (parse(d).getDay() + 6) % 7 + 1;
const weekStartOf = d => addD(d, -(isoDay(d) - 1));
function weekDone(entry, ws) { for (let i = 0; i < 7; i++) { const dt = addD(ws, i), D = S.days[dt]; if (D && (D.workouts || []).some(w => w.weekRef === entry.id)) return dt; } return null; }
function weekCard(plan) {
  const wk = (plan.meta?.week || []).filter(x => x.title || x.block); if (!wk.length) return "";
  const t = today(), ws = weekStartOf(t), td = isoDay(t);
  const row = x => { const dn = weekDone(x, ws), due = x.d && x.d === td, past = x.d && x.d < td;
    return `<div class="li"><div class="grow"><div class="t">${esc(x.title || x.block)}</div><div class="s">${KINDS[x.kind]?.[0] || ""}${x.dur ? " · " + esc(x.dur) + " Min." : ""}${dn ? " · erledigt " + WD[isoDay(dn)] : ""}</div></div>${dn ? `<span class="pill good">✓</span>` : `<button class="btn small ${due ? "" : "quiet"}" data-act="${x.kind === "plan" ? "weekStart" : "weekLog"}" data-id="${x.id}">${due ? "Jetzt" : past ? "Nachtragen" : "Erledigt"}</button>`}</div>`; };
  const done = wk.filter(x => weekDone(x, ws)).length;
  return `<section class="card"><div class="row between"><div><div class="eyebrow">Deine Woche</div><h3>${done} von ${wk.length} erledigt</h3></div><span class="small muted">KW ${kw(t)}</span></div><div class="bar gold"><i style="width:${done / wk.length * 100}%"></i></div>
   ${[1, 2, 3, 4, 5, 6, 7].map(d => { const L = wk.filter(x => num(x.d) === d); if (!L.length) return ""; return `<div><div class="label" style="${d === td ? "color:var(--gold)" : ""}">${WDL[d]}${d === td ? " · heute" : ""}</div><div class="list">${L.map(row).join("")}</div></div>`; }).join("")}
   ${wk.some(x => !num(x.d)) ? `<div><div class="label">Flexibel diese Woche</div><div class="list">${wk.filter(x => !num(x.d)).map(row).join("")}</div></div>` : ""}</section>`;
}
function kw(d) { const dt = parse(d); dt.setDate(dt.getDate() + 4 - (dt.getDay() || 7)); const y0 = new Date(dt.getFullYear(), 0, 1); return Math.ceil(((dt - y0) / 864e5 + 1) / 7); }

function sortPeriods() { const c = cyc(); c.periods.sort((a, b) => a.start < b.start ? -1 : 1); }
function periodsCard() {

function perEndAt(sel) {

  if (before && diffD(before.start, sel) <= 14) { const old = rangeDays(before.start, before.end); before.end = sel; clearFlow(old, rangeDays(before.start, before.end)); saveCycle(); render(); toast("Letzter Tag: " + fmt(sel)); return; }
  const after = c.periods.find(p => p.start > sel && diffD(sel, p.start) <= 10);

// cfg: { id, workouts:[{date,title,ex:[{n,sets:[{kg,reps,rpe,done}]}]}], measures:[{date,...}], mdefs:[[k,n,u]], phase:d=>({k,n,c})|null, phases:[[k,n,c]], well:[{date,...}], wdefs:[[k,n,u,max]], start }

const sxDY = d => { const [y, m, dd] = d.split("-"); return dd + "." + m + "." + y.slice(2); };
const sxDays = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
const sxE = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sxE1 = (kg, r) => r > 0 && r <= 12 ? kg * (1 + r / 30) : r > 12 ? kg * 1.4 : kg;
const sxWk = d => { const x = new Date(d + "T12:00"); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.toISOString().slice(0, 10); };

function sxAnalyze(cfg) {
  const W = (cfg.workouts || []).filter(w => w.date).sort((a, b) => a.date < b.date ? -1 : 1);
  const ex = {}; let vol = 0; const prs = [];
  W.forEach(w => (w.ex || []).forEach(e => {

    if (!sets.length) { X.sessions.push({ date: w.date, top: 0, e1: 0, vol: 0, reps: 0 }); return; }
    const top = Math.max(...sets.map(s => sxN(s.kg))); const topSet = sets.filter(s => sxN(s.kg) === top).sort((a, b) => sxN(b.reps) - sxN(a.reps))[0];
    const e1 = Math.max(...sets.map(s => sxE1(sxN(s.kg), sxN(s.reps)))); const v = sets.reduce((a, s) => a + sxN(s.kg) * sxN(s.reps), 0); vol += v;
    const rpe = sets.map(s => sxN(s.rpe)).filter(Boolean); const ph = cfg.phase ? cfg.phase(w.date) : null;
    if (X.first == null) X.first = { date: w.date, top, reps: sxN(topSet.reps) };
    else if (top > X.best) prs.push({ date: w.date, n, kg: top, reps: sxN(topSet.reps), prev: X.best, ph });
    else if (top === X.best && sxN(topSet.reps) > (X.bestReps || 0)) prs.push({ date: w.date, n, kg: top, reps: sxN(topSet.reps), prevReps: X.bestReps, ph, rep: true });
    if (top > X.best || (top === X.best && sxN(topSet.reps) > (X.bestReps || 0))) { X.best = top; X.bestReps = sxN(topSet.reps); X.bestDate = w.date; }
    X.bestE1 = Math.max(X.bestE1, e1); X.sessions.push({ date: w.date, top, e1, vol: v, reps: sxN(topSet.reps), rpe: rpe.length ? rpe.reduce((a, b) => a + b, 0) / rpe.length : null, ph });
  }));
  const exList = Object.values(ex).filter(x => x.sessions.some(s => s.top)).sort((a, b) => b.sessions.length - a.sessions.length || a.n.localeCompare(b.n));
  // Wochen
  const weeks = {}; W.forEach(w => { const k = sxWk(w.date); weeks[k] = (weeks[k] || 0) + 1; });
  let streak = 0; { let k = sxWk(new Date().toISOString().slice(0, 10)); if (!weeks[k]) { const x = new Date(k + "T12:00"); x.setDate(x.getDate() - 7); k = x.toISOString().slice(0, 10); } while (weeks[k]) { streak++; const x = new Date(k + "T12:00"); x.setDate(x.getDate() - 7); k = x.toISOString().slice(0, 10); } }
  // Stärke nach Phase: e1RM relativ zum persönlichen Mittel je Übung
  const phStr = {}; exList.forEach(x => { const s = x.sessions.filter(s => s.e1 && s.ph); if (s.length < 3) return; const mean = s.reduce((a, b) => a + b.e1, 0) / s.length; s.forEach(z => { const k = z.ph.k; (phStr[k] ||= []).push(z.e1 / mean - 1); }); });

}
