<style>
/* Layout: phone-first group program. Deep violet-black stage, gold serif headings, lilac actions, one bottom nav. Single dark look (brand). */
:root{
  --ink:#0B0910; --stage:#141019; --stage2:#1C1723; --stage3:#262030; --line:#332B3D;
  --gold:#E6D08A; --gold2:#CDBE86; --cream:#F0E8D0; --muted:#A79DB0;
  --lilac:#D4BFF2; --lilac2:#A88AD8; --ink2:#1A1225; --warn:#F0C46A; --good:#9ED6B3;
  --p-mens:#C9779B; --p-foll:#A88AD8; --p-ovu:#E6D08A; --p-lut:#8FA8C9;
  --f-d:"Cormorant Garamond","Iowan Old Style",Georgia,serif; --f-u:"Montserrat","Avenir Next","Segoe UI",system-ui,sans-serif; --f-s:"Great Vibes","Snell Roundhand",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--cream)}
body{font-family:var(--f-u);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
h1,h2,h3{font-family:var(--f-d);color:var(--gold);font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2.1rem}h2{font-size:1.6rem}h3{font-size:1.25rem}
p{margin:0}
a{color:var(--lilac)}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
.wrap.wide{max-width:1100px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--ink) 78%,transparent);display:flex;align-items:center;gap:12px;padding-block:12px}
.top img{width:40px;height:auto}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-size:.7rem;letter-spacing:.3em;color:var(--gold);font-weight:500}
.brand span{font-family:var(--f-s);color:var(--lilac);font-size:1.15rem;margin-top:2px}
.top .sp{flex:1}.top .btn{white-space:nowrap}.brand{white-space:nowrap;min-width:0;overflow:hidden}@media (max-width:420px){.top img{width:32px}.brand b{font-size:.6rem;letter-spacing:.2em}.brand span{font-size:1rem}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--stage2);border:1px solid var(--line);border-radius:14px;padding:12px}
.card{background:var(--stage);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hi{border-color:var(--lilac2);background:#1a1424}
.card.gold{border-color:var(--gold2)}
.eyebrow{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--lilac);font-weight:600}
.label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:.86rem}.tiny{font-size:.74rem}.gold-t{color:var(--gold)}.lil{color:var(--lilac)}
.num{font-variant-numeric:tabular-nums}
.btn{appearance:none;border:1px solid var(--lilac);background:var(--lilac);color:var(--ink2);font-weight:600;border-radius:999px;padding:13px 20px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--gold);border-color:var(--gold2)}
.btn.quiet{background:var(--stage2);color:var(--cream);border-color:var(--line)}
.btn.small{min-height:38px;padding:8px 14px;font-size:.82rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--lilac);cursor:pointer;padding:6px 0;font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--stage2);color:var(--cream);border-radius:999px;padding:9px 14px;min-height:42px;cursor:pointer;font-size:.86rem}
.chip.on{background:var(--lilac);border-color:var(--lilac);color:var(--ink2);font-weight:600}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--stage2);cursor:pointer;font-weight:600;font-size:1.05rem}
.scale button.on{background:var(--lilac);color:var(--ink2);border-color:var(--lilac)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.inp{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;font-size:1rem;color:var(--cream)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--lilac2);outline:none}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:.9rem}
.check input{width:24px;height:24px;accent-color:var(--lilac);flex:none;margin-top:1px}
.bar{height:8px;border-radius:99px;background:var(--stage3);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500}.li .s{font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:600;border:1px solid var(--line)}
.pill.lil{color:var(--lilac);border-color:#4a3d5e}.pill.gold{color:var(--gold);border-color:#5a5130}.pill.warn{color:var(--warn);border-color:#5b4924}.pill.good{color:var(--good);border-color:#2f5140}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,9,16,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:10px 0 12px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:.68rem;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--gold)}.nav button.on svg{color:var(--lilac)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--stage);border-radius:999px;padding:9px 14px;min-height:42px;cursor:pointer;font-size:.84rem}
.tabs button.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
.phase{display:flex;gap:14px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.week{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--stage);cursor:pointer;text-align:left;width:100%}
.week.on{border-color:var(--gold2);background:#1d1822}
.week.lock{opacity:.5;cursor:default}
.week .n{font-family:var(--f-d);font-size:2rem;color:var(--lilac);width:34px;text-align:center;flex:none;line-height:1}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--stage);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:92%;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--ink);font-weight:600;padding:10px 18px;border-radius:999px;z-index:50;font-size:.88rem;max-width:90%;text-align:center}
.disc{font-size:.72rem;color:var(--muted);text-align:center;padding:18px 0 4px}
.rich{white-space:pre-wrap;line-height:1.6}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--stage2);display:flex;flex-direction:column;gap:4px}
.ex b{color:var(--gold);font-weight:600}
details.rc{border:1px solid var(--line);border-radius:16px;background:var(--stage);padding:14px}
details.rc summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.rc summary::-webkit-details-marker{display:none}
.cert{border:2px solid var(--gold);border-radius:22px;padding:26px 20px;text-align:center;background:radial-gradient(120% 120% at 50% 0%,#2a2136,var(--stage) 60%);display:flex;flex-direction:column;gap:10px;align-items:center}
.cert .sig{font-family:var(--f-s);font-size:2.4rem;color:var(--lilac);line-height:1}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
.tbl th{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tw{overflow-x:auto}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}
.hero{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;padding-block:30px 10px}
.hero img{width:150px}
.way{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--stage);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.way.on{border-color:var(--lilac);background:#1d1628;box-shadow:inset 0 0 0 1px var(--lilac)}
.way b{font-family:var(--f-d);font-size:1.4rem;color:var(--gold);font-weight:600}
@media (prefers-reduced-motion:no-preference){.fade{animation:fd .3s ease both}@keyframes fd{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

const myRound = () => S.me?.round ? S.rounds[S.me.round] : null;

  const gaps = st.slice(1).map((x, i) => diffD(st[i], x)).filter(g => g >= 20 && g <= 45).slice(-3);
  if (gaps.length) c.len = Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length);

}

  if (ovMark && d >= c.last && d < addD(ovMark, 14)) {

    const k = cd <= 5 ? "mens" : cd < ovCd - 1 ? "foll" : cd <= ovCd + 1 ? "ovu" : "lut";
    return { k, cd, len, next: addD(ovMark, 14), ov: ovMark };
  }
  const base = ovMark && d >= addD(ovMark, 14) ? addD(ovMark, 14) : c.last;
  const cd = ((diffD(base, d) % len) + len) % len + 1; const ov = len - 14;
  const k = cd <= 5 ? "mens" : cd < ov - 1 ? "foll" : cd <= ov + 1 ? "ovu" : "lut";

}

function sxAnalyze(cfg) {

  }));
  const exList = Object.values(ex).filter(x => x.sessions.some(s => s.top)).sort((a, b) => b.sessions.length - a.sessions.length || a.n.localeCompare(b.n));
  // Wochen
  const weeks = {}; W.forEach(w => { const k = sxWk(w.date); weeks[k] = (weeks[k] || 0) + 1; });
  let streak = 0; { let k = sxWk(new Date().toISOString().slice(0, 10)); if (!weeks[k]) { const x = new Date(k + "T12:00"); x.setDate(x.getDate() - 7); k = x.toISOString().slice(0, 10); } while (weeks[k]) { streak++; const x = new Date(k + "T12:00"); x.setDate(x.getDate() - 7); k = x.toISOString().slice(0, 10); } }

}

  const X = t => L + (Wd - L - R) * ((t - x0) / ((x1 - x0) || 1)), Y = v => T + (H - T - B) * (1 - (v - y0) / ((y1 - y0) || 1));

  const path = pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");

}

  const out = []; const T = A.exList.map(x => ({ x, d: x.best - (x.first?.top || 0), p: x.first?.top ? x.best / x.first.top - 1 : 0 })).filter(z => z.d > 0).sort((a, b) => b.p - a.p);
  if (T[0]) out.push(`💪 Größter Sprung: <b class="gold-t gold">${sxE(T[0].x.n)}</b> von ${sxF(T[0].x.first.top)} auf ${sxF(T[0].x.best)} kg (+${sxF(T[0].p * 100, 0)} %).`);
  const lastPr = A.prs[A.prs.length - 1]; if (lastPr) out.push(`🏆 Letzter Rekord: ${sxE(lastPr.n)} mit ${sxF(lastPr.kg)} kg × ${lastPr.reps} am ${sxD(lastPr.date)}${lastPr.ph ? " (" + sxE(lastPr.ph.n) + ")" : ""}.`);
  if (cfg.phase && cfg.phases) {
    const byPh = {}; A.prs.filter(p => !p.rep && p.ph).forEach(p => byPh[p.ph.k] = (byPh[p.ph.k] || 0) + 1); const tot = Object.values(byPh).reduce((a, b) => a + b, 0);
    if (tot >= 3) { const top = Object.entries(byPh).sort((a, b) => b[1] - a[1])[0]; const pn = (cfg.phases.find(p => p[0] === top[0]) || [, top[0]])[1]; out.push(`🌙 ${Math.round(top[1] / tot * 100)} % deiner Rekorde: <b class="gold-t gold">${sxE(pn)}</b>. Deine Rekord-Phase.`); }
    const st = cfg.phases.map(([pk, pn]) => { const a = A.phStr[pk] || []; return a.length >= 2 ? { pn, v: a.reduce((x, y) => x + y, 0) / a.length } : null; }).filter(Boolean).sort((a, b) => b.v - a.v);
    if (st.length >= 2 && st[0].v - st[st.length - 1].v > 0.02) out.push(`⚡ Stärkste Phase: <b class="gold-t gold">${sxE(st[0].pn)}</b>. Da bist du im Schnitt ${sxF((st[0].v - st[st.length - 1].v) * 100)} % stärker als in der schwächsten (${sxE(st[st.length - 1].pn)}).`);
    const ws = A.M.filter(m => sxN(m.weight)).map(m => ({ v: sxN(m.weight), ph: cfg.phase(m.date) })).filter(x => x.ph); const g = {}; ws.forEach(x => (g[x.ph.k] ||= []).push(x.v));
    const av = Object.entries(g).filter(([, a]) => a.length).map(([k, a]) => ({ k, v: a.reduce((p, q) => p + q, 0) / a.length })); if (av.length >= 2) { av.sort((a, b) => b.v - a.v); const d = av[0].v - av[av.length - 1].v; if (d >= 0.3) out.push(`💧 Dein Gewicht schwankt im Zyklus um ca. ${sxF(d)} kg, am höchsten: ${sxE((cfg.phases.find(p => p[0] === av[0].k) || [, av[0].k])[1])}. Das ist Wasser, kein Fett.`); }
  }
  const wa = A.M.filter(m => sxN(m.waist)); if (wa.length >= 2) { const d = sxN(wa[wa.length - 1].waist) - sxN(wa[0].waist); if (d < 0) out.push(`📏 Taille ${sxF(d)} cm in ${Math.max(1, Math.round(sxDays(wa[0].date, wa[wa.length - 1].date) / 7))} Wochen.`); }
  if (A.streak >= 3) out.push(`🔥 ${A.streak} Wochen in Folge trainiert. Dranbleiben ist dein Superpower.`);

}

  ${FE_SLOTS.map(sl => { const ms = L.filter(m => m.slot === sl); if (!ms.length) return ""; return `<section class="card"><div class="row between"><h3>${sl}</h3><span class="tiny muted num">${Math.round(feSum(ms.flatMap(m => m.items)).kcal)} kcal</span></div><div class="list">${ms.map(m => { const s = feSum(m.items); return `<button class="li" data-act="feEdit" data-v="${m.id}" style="width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer"><span class="grow"><span class="t">${esc(m.name || m.items.map(i => i.food).slice(0, 3).join(", "))}</span><br><span class="s num">${feMacro(s)}</span></span><span class="muted">›</span></button>`; }).join("")}</div></section>`; }).join("")}

  <details class="card" data-l3="feGoals"${(S.l3open || {}).feGoals ? " open" : ""}><summary style="cursor:pointer;list-style:none"><b>Meine Ziele (freiwillig)</b> <span class="tiny muted">${G.kcal || G.p ? (G.kcal ? G.kcal + " kcal" : "") + (G.p ? " · " + G.p + " g Eiweiß" : "") : "nicht gesetzt"}</span></summary>
   <div class="grid2" style="margin-top:10px"><div class="field"><label for="fgK">kcal am Tag</label><input class="inp num" id="fgK" inputmode="numeric" value="${esc(G.kcal || "")}"></div><div class="field"><label for="fgP">Eiweiß (g)</label><input class="inp num" id="fgP" inputmode="numeric" value="${esc(G.p || "")}"></div></div>
   <p class="tiny muted">Unsicher, welche Werte zu dir passen? Frag Lisa-Marie im HER Talk.</p><button class="btn small" data-act="feGoalSave">Ziele speichern</button></details>`;
};
function feRefresh() { const m = S.fe; if (!m) return; const s = feSum(m.items); const a = document.getElementById("fesum"); if (a) a.textContent = feMacro(s);
  m.items.forEach((it, i) => { const el = document.getElementById("fem" + i); const v = feCalc(it); if (el && el.firstElementChild) el.firstElementChild.innerHTML = `<b class="gold-t">${Math.round(v.kcal)} kcal</b> · E ${r1(v.p)} · K ${r1(v.c)} · F ${r1(v.f)}`; }); }
const feOpen = (o) => { S.fe = Object.assign({ slot: (() => { const h = new Date().getHours(); return h < 11 ? "Frühstück" : h < 15 ? "Mittag" : h < 18 ? "Snack" : "Abend"; })(), items: [], q: "", name: "" }, o || {}); };
window.addEventListener("input", e => {
  const t = e.target; if (!t || S.tab !== "essen") return;
  if (t.id === "feq") { if (S.fe) S.fe.qq = t.value; const P = feParse(t.value); const b = document.getElementById("feprev"); if (b) b.innerHTML = P.map(p => p.F ? `<span>✓ ${p.g} g ${esc(p.F[0])} · ${Math.round(p.F[1] * p.g / 100)} kcal</span>` : `<span style="color:var(--warn)">? „${esc(p.name)}“ nicht gefunden</span>`).join(""); }
  else if (t.id === "fes") { S.fe.q = t.value; const b = document.getElementById("feres"); if (b) b.innerHTML = feResRows(feMatch(t.value, 10), t.value.trim()); }
  else if (t.id === "fename") S.fe.name = t.value;
  else if (t.dataset.fek === "grams") { const it = S.fe.items[+t.dataset.fei]; it.grams = t.value; feRefresh(); }
  else if (t.dataset.fek === "food") { const i = +t.dataset.fei, it = S.fe.items[i]; it.food = t.value; const b = document.getElementById("fesug" + i); if (b) b.innerHTML = feMatch(t.value, 5).map(({ F, idx }) => `<button data-act="fePick" data-i="${i}" data-v="${idx}" style="display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--stage);color:inherit;border-radius:12px;padding:8px 10px;font:inherit;font-size:.85rem;cursor:pointer"><b>${esc(F[0])}</b><span class="tiny muted">${Math.round(F[1])} kcal je 100 g</span></button>`).join(""); }
}, true);
window.addEventListener("keydown", e => { if (e.key === "Enter" && e.target?.id === "feq") { e.preventDefault(); document.querySelector('[data-act="feQuick"]')?.click(); } }, true);
window.addEventListener("click", e => {
  const b = e.target.closest?.("[data-act]"); if (!b) return; const a = b.dataset.act; if (!/^fe/.test(a)) return; e.stopImmediatePropagation(); const v = b.dataset.v;
  const re = () => { render(); }; const m = S.fe;
  if (a === "feGo") { pushHist(); S.tab = "essen"; S.feDate = today(); if (v === "new") feOpen(); re(); window.scrollTo(0, 0); }
  else if (a === "feNew") { feOpen(); re(); }
  else if (a === "feClose") { S.fe = null; re(); }
  else if (a === "feDate") { S.feDate = v; S.fe = null; re(); }
  else if (a === "feSlot") { m.slot = v; re(); }
  else if (a === "feAdd") { const F = (S.feCache || feAll())[+v]; if (F) { m.items.push(feItem(F, num(F[5]) || 100)); m.q = ""; toast(F[0] + " hinzugefügt"); re(); } }
  else if (a === "feQuick") { const inp = document.getElementById("feq"); const P = feParse(inp?.value); if (!P.length) return; const miss = []; m.qq = ""; P.forEach(p => { if (p.F) m.items.push(feItem(p.F, p.g)); else miss.push(p.name); }); toast(miss.length ? "Nicht gefunden: " + miss.join(", ") : P.length + " Lebensmittel hinzugefügt"); if (miss.length) m.q = miss[0]; re(); setTimeout(() => document.getElementById(miss.length ? "fes" : "feq")?.focus(), 60); }
  else if (a === "fePick") { const F = (S.feCache || feAll())[+v]; const it = m.items[+b.dataset.i]; if (F && it) { const g = num(it.grams) > 0 ? num(it.grams) : num(F[5]) || 100; m.items[+b.dataset.i] = feItem(F, g); re(); } }
  else if (a === "feDel") { m.items.splice(+v, 1); re(); }
  else if (a === "feG") { const it = m.items[+b.dataset.i]; it.grams = Math.max(0, num(it.grams) + num(v)); re(); }
  else if (a === "feGP") { const it = m.items[+b.dataset.i]; it.grams = it.pg; re(); }
  else if (a === "fePor") { const it = m.items[+b.dataset.i]; it.portions = Math.max(0.5, num(it.portions || 1) + num(v)); re(); }
  else if (a === "feSave") { if (!m.items.length) return; const d = S.feDate || today(); S.priv.food ||= {}; const L = (S.priv.food[d] ||= []); const rec = { id: m.id || uid8(), slot: m.slot, name: (m.name || "").trim(), items: m.items.map(i => { const o = Object.assign({}, i); delete o.open; return o; }) }; const k = L.findIndex(x => x.id === rec.id); if (k >= 0) L[k] = rec; else L.push(rec);
    Object.keys(S.priv.food).forEach(x => { if (x < addD(today(), -120)) delete S.priv.food[x]; }); savePriv(); S.fe = null; toast("Gespeichert"); re(); }
  else if (a === "feEdit") { const x = feDay(S.feDate || today()).find(y => y.id === v); if (x) { S.fe = JSON.parse(JSON.stringify(x)); S.fe.q = ""; re(); window.scrollTo(0, 0); } }
  else if (a === "feRemove") { const d = S.feDate || today(); S.priv.food[d] = feDay(d).filter(x => x.id !== m.id); savePriv(); S.fe = null; toast("Gelöscht"); re(); }
  else if (a === "feNewOwn") { S.feOwn = { name: (m && m.q) || "" }; re(); }
  else if (a === "feOwnX") { S.feOwn = null; re(); }
  else if (a === "feOwnSave") { const g = id => num(document.getElementById(id)?.value); const name = (document.getElementById("foN")?.value || "").trim(); if (!name || !g("foK")) { toast("Name und kcal bitte ausfüllen"); return; } const id = uid8(); S.priv.myFoods ||= {}; S.priv.myFoods[id] = { name, kcal: g("foK"), p: g("foP"), c: g("foC"), f: g("foF"), pg: 100 }; savePriv(); S.feOwn = null; if (!S.fe) feOpen(); S.fe.items.push(feItem([name, g("foK"), g("foP"), g("foC"), g("foF"), 100, "100 g", "mine"], 100)); S.fe.q = ""; re(); }
  else if (a === "feGoalSave") { S.priv.foodGoals = { kcal: Math.round(num(document.getElementById("fgK")?.value)) || 0, p: Math.round(num(document.getElementById("fgP")?.value)) || 0 }; savePriv(); toast("Ziele gespeichert"); re(); }
  else if (a === "feRecipe") { const r = (S.content.recipes || {})[v]; if (!r) return; let mac = [num(r.kcal), num(r.p), num(r.c), num(r.f)]; try { const sw = typeof ntSwaps === "function" ? ntSwaps(r) : null; if (sw && sw.m && sw.list && sw.list.length) mac = sw.m; } catch (x) { }
    pushHist(); S.tab = "essen"; S.feDate = today(); feOpen({ slot: ({ fr: "Frühstück", mi: "Mittag", ab: "Abend", sn: "Snack" })[r.cat] || undefined, name: r.name, items: [{ food: r.name, portion: true, portions: 1, kcal: mac[0], p: mac[1], c: mac[2], f: mac[3] }] }); if (!S.fe.slot) S.fe.slot = "Mittag"; re(); window.scrollTo(0, 0); }
}, true);
// Rezepte: „Als gegessen eintragen“
const _rcCardFE = recipeCard;
recipeCard = function (r) { const h = _rcCardFE(r); const i = h.lastIndexOf("</div></details>"); if (i < 0) return h; return h.slice(0, i) + `<button class="btn small quiet" data-act="feRecipe" data-v="${r.id}" style="align-self:flex-start">🍽️ Als gegessen eintragen</button>` + h.slice(i); };
// Startseite: Zeile „Essen heute“ in „Dein Tag“; Ich-Übersicht: Kachel
const _heuteFE = VIEWS.heute;
VIEWS.heute = () => { const h = _heuteFE(); if (h.indexOf("l3hero") < 0) return h; const s = feSum(feDay(today()).flatMap(m => m.items)); const G = S.priv?.foodGoals || {};
  const row = `<button class="l3row" data-act="feGo" data-v="">${l3Row("var(--gold)", "🍽️", "Essen heute", s.kcal ? Math.round(s.kcal) + (G.kcal ? " / " + G.kcal : "") + " kcal · E " + Math.round(s.p) + (G.p ? " / " + G.p : "") + " g" : "Mit Datenbank, ohne Abtippen", true)}</button><button class="l3row" data-act="feGo" data-v="new">${l3Row("var(--lilac)", "+", "Essen eintragen", "z. B. „100 g Möhre, 250 g Quark“", false)}</button>`;
  const i = h.indexOf(`<section class="l3card">`, h.indexOf(`<div class="l3sec"><h3>Dein Tag</h3>`)); if (i < 0) return h; return h.slice(0, i + 24) + row + h.slice(i + 24); };
try { L3_SUB.essen = "Essen-Tagebuch mit Datenbank"; L3_G[1][1].unshift("essen"); } catch (e) { }

boot();
})();
</script>
